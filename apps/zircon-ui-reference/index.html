<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ORIGINS — Zircon UI Reference</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <div class="toolbar">
      <strong>Zircon UI reference</strong>
      <button data-open="character">Character</button>
      <button data-open="inventory">Inventory</button>
      <button data-open="magic">Magic</button>
      <button data-open="quest">Quest</button>
      <button data-open="menu">Menu</button>
      <button data-close-all>Close windows</button>
    </div>
    <div id="stage" class="stage" aria-label="1024 by 768 Zircon desktop reference"></div>
    <p class="note">All visible UI artwork in this harness is extracted from the current Zircon .Zl libraries. Text and sample values are runtime overlays.</p>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
