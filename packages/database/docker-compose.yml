services:
  postgres:
    image: postgres:16
    container_name: origins-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: origins
      POSTGRES_PASSWORD: origins
      POSTGRES_DB: origins
    ports:
      - "5432:5432"
    volumes:
      - origins_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U origins -d origins"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  origins_postgres_data:
