name: Audit Zircon supplemental source contracts

on:
  workflow_dispatch:
  push:
    branches: [origins-game-v1]
    paths:
      - ".github/workflows/audit-zircon-supplemental-contracts.yml"
      - "tools/zircon-ui-importer/supplemental/**"
      - "tools/zircon-ui-importer/run_supplemental_source_contracts.py"
      - "tools/zircon-ui-importer/promote_runtime_manifest_identity.py"
      - "tools/zircon-ui-importer/augment_ranking_reference.py"
      - "tools/zircon-ui-importer/audit_ranking_source_contracts.py"
      - "apps/zircon-ui-reference/extra-runtimes/**"

permissions:
  contents: read

jobs:
  supplemental-source-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout ORIGINS
        uses: actions/checkout@v4
      - name: Checkout current Zircon source
        run: |
          set -euo pipefail
          rm -rf .source/Zircon .build/supplemental
          git clone --depth 1 https://github.com/Suprcode/Zircon.git .source/Zircon
          mkdir -p .build/supplemental
          echo "Zircon source: $(git -C .source/Zircon rev-parse HEAD)"
      - name: Build and promote complete source manifest
        run: |
          set -euo pipefail
          python3 tools/zircon-ui-importer/build_ui_source_spec.py --zircon-root .source/Zircon --out .build/supplemental/ui-source-spec.json
          python3 tools/zircon-ui-importer/augment_ui_custom_tabs.py --spec .build/supplemental/ui-source-spec.json --zircon-root .source/Zircon
          python3 tools/zircon-ui-importer/augment_ui_composites.py --spec .build/supplemental/ui-source-spec.json --zircon-root .source/Zircon --max-depth 2
          python3 tools/zircon-ui-importer/augment_ui_language.py --spec .build/supplemental/ui-source-spec.json --english-messages .source/Zircon/Client/Envir/Translations/EnglishMessages.cs
          python3 tools/zircon-ui-importer/augment_ui_symbols.py --spec .build/supplemental/ui-source-spec.json --zircon-root .source/Zircon
          python3 tools/zircon-ui-importer/augment_ui_derived_geometry_v2.py --spec .build/supplemental/ui-source-spec.json --zircon-root .source/Zircon
          python3 tools/zircon-ui-importer/augment_ui_interactions.py --spec .build/supplemental/ui-source-spec.json --zircon-root .source/Zircon
          python3 tools/zircon-ui-importer/augment_npc_dialog_reference.py --spec .build/supplemental/ui-source-spec.json
          cp apps/zircon-ui-reference/app-layout.js .build/supplemental/app-layout.js
          cp apps/zircon-ui-reference/animated-control-runtime.js .build/supplemental/animated-control-runtime.js
          python3 tools/zircon-ui-importer/promote_runtime_manifest_identity.py --spec .build/supplemental/ui-source-spec.json --registry apps/zircon-ui-reference/game-scene-windows.js
      - name: Assert promoted supplemental matrix
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          spec=json.loads(Path('.build/supplemental/ui-source-spec.json').read_text())
          by={w['field']:w for w in spec['windows']}
          game_controls=sum(len(w.get('controls',[])) for w in spec['windows'])
          nested_controls=sum(len(w.get('controls',[])) for w in spec.get('nestedWindows',[]))
          assert game_controls >= 2284, game_controls
          assert nested_controls >= 143, nested_controls
          assert by['RankingBox']['rankingSourceAudit']['passed'] is True
          assert by['RankingBox']['rankingSourceState']['sourceIndex'] == 210
          assert by['GroupBox']['groupSourceAudit']['passed'] is True
          assert by['GroupHealthBox']['groupHealthSourceAudit']['passed'] is True
          assert spec['deterministicSourceRowAudit']['passed'] is True
          assert spec['deterministicSourceRowAudit']['rankingRows'] == 12
          assert spec['deterministicSourceRowAudit']['dungeonRows'] == 9
          assert spec['deterministicSourceRowAudit']['fortuneRows'] == 9
          assert spec['deterministicSourceRowAudit']['bigMapRows'] == 48
          guild_rows=spec['guildMemberRowAudit']
          assert guild_rows['passed'] is True
          assert guild_rows['headerRows'] == 1
          assert guild_rows['memberRows'] == 17
          assert guild_rows['sourceControls'] == 108
          assert guild_rows['netControlsAdded'] == 107
          guild_root=spec['guildRootHelperAudit']
          assert guild_root['passed'] is True
          assert guild_root['deterministicControls'] == 16
          assert guild_root['panels'] == 6
          assert guild_root['buttons'] == 10
          assert guild_root['runtimeCastlePanelsInvented'] is False
          assert guild_root['clickCreatedModalsInvented'] is False
          game_store=spec['gameStoreCompositeAudit']
          assert game_store['passed'] is True
          assert game_store['deterministicControls'] == 215
          assert game_store['itemRows'] == 10
          assert game_store['topRows'] == 5
          assert game_store['runtimeStoreInfoInvented'] is False
          assert game_store['runtimeItemsInvented'] is False
          helpers=spec['uiCreationHelperInventory']
          assert helpers['passed'] is True
          assert helpers['version'] == 2
          assert helpers['knownBigMapHelpersMaterialized'] is True
          assert helpers['chatOptionsAddNewTabDeferredLocal'] is True
          assert helpers['helpPagesRemainRuntimeBound'] is True
          assert helpers['magicTabsRemainRuntimeBound'] is True
          assert helpers['guildConstructorHelpersMaterialized'] is True
          assert helpers['guildWarRuntimeCastlePanelsRemainNeutral'] is True
          assert helpers['eventCallbacksExcludedFromCreationClassification'] is True
          assert helpers['staticGlobalsDoNotImplyRuntimeData'] is True
          assert helpers['controlsFabricatedByAudit'] is False
          assert helpers['runtimePayloadsInvented'] is False
          literals=spec['supplementalLiteralAssetRefPass']
          assert literals['passed'] is True
          assert literals['requiredDeterministicRowRefsPresent'] is True
          assert literals['symbolicRuntimeRefsInvented'] is False
          print(f'Supplemental source matrix: PASS ({game_controls}+{nested_controls} controls)')
          PY
      - name: Check all fidelity runtime syntax
        run: |
          set -euo pipefail
          for file in apps/zircon-ui-reference/extra-runtimes/*.js; do node --check "$file"; done
