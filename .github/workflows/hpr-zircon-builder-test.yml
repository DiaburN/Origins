name: HPR Zircon Builder Test

on:
  push:
    branches:
      - tools/hpr-zircon-master-builder
    paths:
      - 'TOOLS/hpr_zircon_builder/**'
      - 'TOOLS/zl_extractor/**'
      - '.github/workflows/hpr-zircon-builder-test.yml'
  pull_request:
    paths:
      - 'TOOLS/hpr_zircon_builder/**'
      - 'TOOLS/zl_extractor/**'

jobs:
  test-builder:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r TOOLS/hpr_zircon_builder/requirements.txt

      - name: ZL writer round-trip self test
        shell: pwsh
        run: |
          cd TOOLS/hpr_zircon_builder
          python self_test.py

      - name: Real HispaCrystal v3 reader self test
        shell: pwsh
        run: |
          cd TOOLS/hpr_zircon_builder
          python selftest_real_v3.py

      - name: Bundled analyzer full HPR to ZL smoke test
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'hpr-analyze-e2e'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $hpr = Join-Path $root '000.hpr'
          $analysis = Join-Path $root 'ANALYSIS'
          $master = Join-Path $root 'MASTER'
          $built = Join-Path $root 'BUILT'

          # Generate a deterministic HispaCrystal v3 fixture using the verified real-v3 layout.
          @'
          import gzip, struct, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('TOOLS/hpr_zircon_builder').resolve()))
          import origins_hpr_zircon as core

          out = Path(sys.argv[1])
          def bgra(w,h,seed):
              b=bytearray()
              for y in range(h):
                  for x in range(w):
                      b.extend(((seed+x)&255,(seed+y*3)&255,(seed+x+y)&255,255))
              return bytes(b)
          def rec(w,h,x,y,sx,sy,shadow,raw):
              p=gzip.compress(raw,compresslevel=9)
              return struct.pack('<HHhhhhBI',w,h,x,y,sx,sy,shadow,len(p))+p
          records=[rec(8,7,-4,-10,1,2,1,bgra(8,7,10)),rec(7,6,-3,-9,1,1,1,bgra(7,6,30)),None,rec(5,4,2,-7,0,1,0,bgra(5,4,70))]
          count=len(records); table_end=24+count*4; physical=table_end; offs=[]; blob=bytearray()
          for r in records:
              if r is None: offs.append(0); continue
              offs.append(physical-len(core.SIGNATURE)); blob.extend(r); physical+=len(r)
          frame_set_offset=physical
          tail=b'FRAMESET_V3_TEST'+bytes(range(32))
          header=core.SIGNATURE+struct.pack('<III',3,count,frame_set_offset)+struct.pack(f'<{count}I',*offs)
          out.write_bytes(header+blob+tail)
          '@ | python - $hpr

          python TOOLS/hpr_zircon_builder/origins_hpr_zircon_builder.py analyze --hpr-root $hpr --output $analysis --master-output $master
          $prepared = Join-Path $analysis 'MONSTERS/000'
          python TOOLS/hpr_zircon_builder/origins_hpr_zircon_builder.py build --monster-root $prepared --output $built
          $zl = Join-Path $built '000/000.Zl'

          if (!(Test-Path (Join-Path $analysis 'MONSTERS/000/CURSOR_PROFILE.json'))) { throw 'CURSOR_PROFILE missing' }
          if (!(Test-Path (Join-Path $analysis 'MONSTERS/000/IMAGE_METADATA.csv'))) { throw 'IMAGE_METADATA missing' }
          if (!(Test-Path (Join-Path $analysis 'MONSTERS/000/FRAMES_PNG/000000.png'))) { throw 'frame PNG missing' }
          if (!(Test-Path (Join-Path $master 'MASTER_SHEET.csv'))) { throw 'master sheet missing after analyze' }
          if (!(Test-Path $zl)) { throw 'final ZL missing' }

          @'
          import importlib.util, sys
          from pathlib import Path
          p=Path('TOOLS/zl_extractor/zl_extract.py').resolve()
          spec=importlib.util.spec_from_file_location('zlx',p)
          mod=importlib.util.module_from_spec(spec); sys.modules[spec.name]=mod; spec.loader.exec_module(mod)
          lib=mod.parse(Path(sys.argv[1]))
          assert lib.slots == 4
          assert lib.images[0].present and not lib.images[2].present and lib.images[3].present
          assert lib.images[0].offsetX == -4 and lib.images[0].offsetY == -10
          print('FULL HPR -> ANALYSIS -> ZL ROUND TRIP OK')
          '@ | python - $zl

      - name: Master-sheet CLI smoke test
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'hpr-smoke'
          $monster = Join-Path $root '000'
          New-Item -ItemType Directory -Force -Path $monster | Out-Null
          @'
          {
            "hpr": "000",
            "status": "AUTO_CUSTOM",
            "slot_count": 128,
            "nonempty_image_count": 128,
            "actions": [
              {"visual_action":"Standing","zircon_animation_slot":"Standing","start":0,"count":4,"stride":4,"delay_ms":500,"reverse":false,"semantic":"Standing","semantic_source":"safe-structural"},
              {"visual_action":"Walking","zircon_animation_slot":"Walking","start":32,"count":6,"stride":6,"delay_ms":100,"reverse":false,"semantic":"Moving","semantic_source":"safe-structural"},
              {"visual_action":"Attack1","zircon_animation_slot":"Combat1","start":80,"count":6,"stride":6,"delay_ms":100,"reverse":false,"semantic":"UNKNOWN_VISUAL_ONLY","semantic_source":"not-inferred"}
            ],
            "effects": [],
            "unreferenced_nonempty_ranges": [],
            "issues": [],
            "warnings": []
          }
          '@ | Set-Content -Encoding UTF8 (Join-Path $monster 'CURSOR_PROFILE.json')

          python TOOLS/hpr_zircon_builder/origins_hpr_zircon_builder.py master --analysis-root $root --output (Join-Path $root 'MASTER')
          if (!(Test-Path (Join-Path $root 'MASTER/MASTER_SHEET.csv'))) { throw 'MASTER_SHEET.csv missing' }
          if (!(Test-Path (Join-Path $root 'MASTER/MONSTERS/000/FRAMESET.json'))) { throw 'FRAMESET.json missing' }
          if (!(Test-Path (Join-Path $root 'MASTER/MONSTERS/000/CURSOR_IMPORT_THIS_MONSTER.md'))) { throw 'Cursor instructions missing' }
          Write-Host 'MASTER SHEET SMOKE TEST OK'
