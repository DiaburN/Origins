name: Origins DxR - Zircon Foundation

on:
  push:
    branches: [Origins-DxR]
    paths:
      - 'database/**'
      - 'scripts/bootstrap-zircon.*'
      - 'scripts/verify-zircon-four-class-magics.py'
      - 'scripts/audit-zircon-four-class-db.py'
      - 'scripts/audit-zircon-four-class-runtime.py'
      - 'src/Origins.Database/**'
      - 'tools/Origins.Database.*/**'
      - '.github/workflows/database-foundation.yml'
  pull_request:
    paths:
      - 'database/**'
      - 'scripts/bootstrap-zircon.*'
      - 'scripts/verify-zircon-four-class-magics.py'
      - 'scripts/audit-zircon-four-class-db.py'
      - 'scripts/audit-zircon-four-class-runtime.py'
      - 'src/Origins.Database/**'
      - 'tools/Origins.Database.*/**'
      - '.github/workflows/database-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zircon-foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ORIGINS DxR
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Checkout pinned source-pure Zircon
        run: bash scripts/bootstrap-zircon.sh

      - name: Verify four-class MagicType catalog against pinned Zircon source
        run: python3 scripts/verify-zircon-four-class-magics.py --source vendor/zircon/LibraryCore/Enum.cs --catalog database/magic/zircon-four-class-magic-types.json

      - name: Build pinned Zircon ServerLibrary
        run: dotnet build vendor/zircon/ServerLibrary/ServerLibrary.csproj --configuration Release

      - name: Build ORIGINS database tools
        run: |
          dotnet build tools/Origins.Database.Import/Origins.Database.Import.csproj --configuration Release
          dotnet build tools/Origins.Database.Verify/Origins.Database.Verify.csproj --configuration Release
          dotnet build tools/Origins.Database.Export/Origins.Database.Export.csproj --configuration Release

      - name: Rebuild runtime System.db from committed clean Zircon snapshot
        run: |
          rm -rf Database Backup SnapshotRebuilt ZirconMagicAudit
          mkdir -p Database Backup
          dotnet run --project tools/Origins.Database.Import/Origins.Database.Import.csproj --configuration Release -- \
            database/generated/zircon-system \
            Database \
            Backup

      - name: Verify rebuilt Zircon System.db
        run: dotnet run --project tools/Origins.Database.Verify/Origins.Database.Verify.csproj --configuration Release -- ./Database ./Backup

      - name: Export rebuilt System.db for deterministic round-trip inspection
        run: dotnet run --project tools/Origins.Database.Export/Origins.Database.Export.csproj --configuration Release -- ./Database ./SnapshotRebuilt ./Backup

      - name: Confirm rebuilt MagicInfo is byte-identical to committed Zircon snapshot
        run: cmp database/generated/zircon-system/LibraryCore__Library_SystemModels_MagicInfo.json SnapshotRebuilt/LibraryCore__Library_SystemModels_MagicInfo.json

      - name: Audit four-class MagicInfo rows
        run: >-
          python3 scripts/audit-zircon-four-class-db.py
          --catalog database/magic/zircon-four-class-magic-types.json
          --magic-info database/generated/zircon-system/LibraryCore__Library_SystemModels_MagicInfo.json
          --output ZirconMagicAudit/four-class-magic-db-report.json

      - name: Audit four-class runtime handlers and playable coverage
        run: >-
          python3 scripts/audit-zircon-four-class-runtime.py
          --catalog database/magic/zircon-four-class-magic-types.json
          --magic-info database/generated/zircon-system/LibraryCore__Library_SystemModels_MagicInfo.json
          --magics-root vendor/zircon/ServerLibrary/Models/Magics
          --output ZirconMagicAudit/four-class-magic-runtime-report.json

      - name: Publish Origins DxR Zircon runtime database
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: origins-dxr-zircon-system
          path: |
            Database/System.db
            Database/import-report.json
            SnapshotRebuilt/
            ZirconMagicAudit/four-class-magic-db-report.json
            ZirconMagicAudit/four-class-magic-runtime-report.json
          if-no-files-found: error
