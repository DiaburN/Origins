name: Origins DxR - Zircon Foundation

on:
  push:
    branches: [Origins-DxR]
    paths:
      - 'database/**'
      - 'scripts/bootstrap-zircon.*'
      - 'scripts/fetch-zircon-system-db.*'
      - 'scripts/verify-zircon-four-class-magics.py'
      - 'scripts/audit-zircon-four-class-db.py'
      - 'src/Origins.Database/**'
      - 'tools/Origins.Database.*/**'
      - '.github/workflows/database-foundation.yml'
  pull_request:
    paths:
      - 'database/**'
      - 'scripts/bootstrap-zircon.*'
      - 'scripts/fetch-zircon-system-db.*'
      - 'scripts/verify-zircon-four-class-magics.py'
      - 'scripts/audit-zircon-four-class-db.py'
      - 'src/Origins.Database/**'
      - 'tools/Origins.Database.*/**'
      - '.github/workflows/database-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zircon-foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ORIGINS DxR
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install 7-Zip
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Checkout pinned source-pure Zircon
        run: bash scripts/bootstrap-zircon.sh

      - name: Verify four-class MagicType catalog against pinned Zircon source
        run: python3 scripts/verify-zircon-four-class-magics.py --source vendor/zircon/LibraryCore/Enum.cs --catalog database/magic/zircon-four-class-magic-types.json

      - name: Build pinned Zircon ServerLibrary
        run: dotnet build vendor/zircon/ServerLibrary/ServerLibrary.csproj --configuration Release

      - name: Build ORIGINS database verifier
        run: dotnet build tools/Origins.Database.Verify/Origins.Database.Verify.csproj --configuration Release

      - name: Build ORIGINS database exporter
        run: dotnet build tools/Origins.Database.Export/Origins.Database.Export.csproj --configuration Release

      - name: Fetch canonical Zircon System.db
        run: bash scripts/fetch-zircon-system-db.sh

      - name: Verify canonical Zircon System.db
        run: dotnet run --project tools/Origins.Database.Verify/Origins.Database.Verify.csproj --configuration Release -- ./Database ./Backup

      - name: Export canonical Zircon System.db to JSON for inspection
        run: dotnet run --project tools/Origins.Database.Export/Origins.Database.Export.csproj --configuration Release -- ./Database ./SnapshotZircon ./Backup

      - name: Audit four-class MagicInfo rows
        run: >-
          python3 scripts/audit-zircon-four-class-db.py
          --catalog database/magic/zircon-four-class-magic-types.json
          --magic-info SnapshotZircon/LibraryCore__Library_SystemModels_MagicInfo.json
          --output ZirconMagicAudit/four-class-magic-db-report.json

      - name: Publish canonical Zircon database snapshot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: origins-dxr-zircon-system
          path: |
            Database/System.db
            SnapshotZircon/
            ZirconMagicAudit/four-class-magic-db-report.json
          if-no-files-found: error
