name: Database Foundation

on:
  push:
    branches:
      - main
    paths:
      - 'src/Origins.Database/**'
      - 'tools/Origins.Database.Verify/**'
      - 'tools/Origins.Database.Upgrade/**'
      - 'tools/Origins.Database.Export/**'
      - 'tools/Origins.Database.Import/**'
      - 'tools/Origins.Database.ApplyOverlay/**'
      - 'database/**'
      - 'scripts/bootstrap-zircon.*'
      - 'scripts/fetch-zircon-system-db.*'
      - 'vendor/README.md'
      - '.github/workflows/database-foundation.yml'
  pull_request:
    paths:
      - 'src/Origins.Database/**'
      - 'tools/Origins.Database.Verify/**'
      - 'tools/Origins.Database.Upgrade/**'
      - 'tools/Origins.Database.Export/**'
      - 'tools/Origins.Database.Import/**'
      - 'tools/Origins.Database.ApplyOverlay/**'
      - 'database/**'
      - 'scripts/bootstrap-zircon.*'
      - 'scripts/fetch-zircon-system-db.*'
      - 'vendor/README.md'
      - '.github/workflows/database-foundation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ORIGINS
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pin official Zircon source
        run: bash scripts/bootstrap-zircon.sh

      - name: Build ORIGINS database foundation
        run: dotnet build src/Origins.Database/Origins.Database.csproj --configuration Release

      - name: Build database verifier
        run: dotnet build tools/Origins.Database.Verify/Origins.Database.Verify.csproj --configuration Release

      - name: Build database upgrader
        run: dotnet build tools/Origins.Database.Upgrade/Origins.Database.Upgrade.csproj --configuration Release

      - name: Build database exporter
        run: dotnet build tools/Origins.Database.Export/Origins.Database.Export.csproj --configuration Release

      - name: Build database importer
        run: dotnet build tools/Origins.Database.Import/Origins.Database.Import.csproj --configuration Release

      - name: Build overlay tool
        run: dotnet build tools/Origins.Database.ApplyOverlay/Origins.Database.ApplyOverlay.csproj --configuration Release

  migrate-and-roundtrip-system-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ORIGINS
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install 7-Zip
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Pin official Zircon source
        run: bash scripts/bootstrap-zircon.sh

      - name: Fetch published Zircon System.db
        run: bash scripts/fetch-zircon-system-db.sh

      - name: Verify source database
        run: dotnet run --project tools/Origins.Database.Verify/Origins.Database.Verify.csproj --configuration Release -- ./Database ./Backup

      - name: Upgrade copied System.db using current Zircon mappings
        run: dotnet run --project tools/Origins.Database.Upgrade/Origins.Database.Upgrade.csproj --configuration Release -- ./Database/System.db ./Database2026 ./Backup2026

      - name: Verify upgraded database
        run: dotnet run --project tools/Origins.Database.Verify/Origins.Database.Verify.csproj --configuration Release -- ./Database2026 ./Backup2026

      - name: Export every Zircon system collection to JSON
        run: dotnet run --project tools/Origins.Database.Export/Origins.Database.Export.csproj --configuration Release -- ./Database2026 ./SnapshotBase ./Backup2026

      - name: Apply ORIGINS overlays
        run: dotnet run --project tools/Origins.Database.ApplyOverlay/Origins.Database.ApplyOverlay.csproj --configuration Release -- ./SnapshotBase ./database/overlays ./SnapshotOrigins

      - name: Rebuild ORIGINS System.db from overlayed JSON snapshot
        run: dotnet run --project tools/Origins.Database.Import/Origins.Database.Import.csproj --configuration Release -- ./SnapshotOrigins ./DatabaseOrigins ./BackupOrigins

      - name: Verify ORIGINS reconstructed database
        run: dotnet run --project tools/Origins.Database.Verify/Origins.Database.Verify.csproj --configuration Release -- ./DatabaseOrigins ./BackupOrigins

      - name: Publish reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zircon-system-db-reports
          path: |
            Database2026/migration-report.json
            SnapshotOrigins/overlay-report.json
            DatabaseOrigins/import-report.json
          if-no-files-found: warn

      - name: Publish editable snapshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: origins-zircon-system-snapshots
          path: |
            SnapshotBase/
            SnapshotOrigins/
          if-no-files-found: error

      - name: Publish upgraded and ORIGINS System.db files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: origins-zircon-system-db-2026
          path: |
            Database2026/System.db
            DatabaseOrigins/System.db
          if-no-files-found: error

      - name: Publish validated base snapshot to generated branch
        if: success() && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf database/generated/zircon-system
          mkdir -p database/generated/zircon-system
          cp -a SnapshotBase/. database/generated/zircon-system/
          cp Database2026/migration-report.json database/generated/zircon-system/migration-report.json
          cp DatabaseOrigins/import-report.json database/generated/zircon-system/import-report.json
          cp SnapshotOrigins/overlay-report.json database/generated/zircon-system/overlay-report.json

          git config user.name "ORIGINS Database Bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B generated/zircon-system-snapshot
          git add database/generated/zircon-system

          if git diff --cached --quiet; then
            echo "Generated snapshot is unchanged."
            exit 0
          fi

          git commit -m "generated(db): refresh validated Zircon system snapshot"
          git push --force origin HEAD:generated/zircon-system-snapshot
