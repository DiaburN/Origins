name: Origins DxR - Female Body Fishing Discovery

on:
  push:
    branches: [Origins-DxR]
    paths:
      - 'scripts/fetch-zircon-player-libraries.py'
      - 'tools/zircon-zl-frame-probe/**'
      - 'scripts/prepare-zircon-libraryeditor-managed-dxt.py'
      - 'apps/origins-web-runtime/generated/zircon-player-asset-contract.json'
      - '.github/workflows/origins-dxr-body-fishing-discovery.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: origins-dxr-female-fishing-discovery-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIRCON_COMMIT: cbf1aa919083bc13fc3f23f93772a8ab8370632d
  CONTRACT_JSON: apps/origins-web-runtime/generated/zircon-player-asset-contract.json
  RAW_ROOT: runtime-assets/zircon-female-body-probe

jobs:
  fishing-discovery:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Bootstrap pinned Zircon
        id: bootstrap
        shell: pwsh
        run: |
          ./scripts/bootstrap-zircon.ps1
          $actual=(git -C vendor/zircon rev-parse HEAD).Trim()
          if ($actual -ne $env:ZIRCON_COMMIT) { throw "Pinned Zircon mismatch: $actual" }

      - name: Prepare exporter-only managed DXT decoder
        id: manageddxt
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/body-fishing-discovery | Out-Null
          python scripts/prepare-zircon-libraryeditor-managed-dxt.py `
            --zircon-root vendor/zircon `
            --report artifacts/body-fishing-discovery/managed-dxt.json

      - name: Fetch official female body libraries from Zircon contract
        id: fetch
        continue-on-error: true
        shell: pwsh
        run: |
          python scripts/fetch-zircon-player-libraries.py `
            --zircon-root vendor/zircon `
            --contract $env:CONTRACT_JSON `
            --output-root $env:RAW_ROOT `
            --report artifacts/body-fishing-discovery/fetch.json `
            --profile female-body `
            --workers 6

      - name: Build lightweight ZL frame probe
        id: build
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet build tools/zircon-zl-frame-probe/ZirconZlFrameProbe.csproj -c Release -p:Platform=AnyCPU

      - name: Probe FishingCast Wait Reel in downloaded female body banks
        id: probe
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $fetch = Get-Content artifacts/body-fishing-discovery/fetch.json -Raw | ConvertFrom-Json
          $probeArgs = @(
            '--contract', $env:CONTRACT_JSON,
            '--source-root', $env:RAW_ROOT,
            '--output', 'artifacts/body-fishing-discovery/fishing-probe.json'
          )
          foreach ($row in $fetch.libraries) {
            if ($row.status -eq 'READY') {
              $probeArgs += @('--library', [string]$row.libraryFile)
            }
          }
          if (($probeArgs | Where-Object { $_ -eq '--library' }).Count -eq 0) { throw 'No female body libraries were downloaded.' }
          & dotnet run --project tools/zircon-zl-frame-probe/ZirconZlFrameProbe.csproj `
            -c Release -p:Platform=AnyCPU --no-build -- @probeArgs
          if ($LASTEXITCODE -ne 0) { throw "ZL fishing probe exited with code $LASTEXITCODE" }

      - name: Write discovery evidence
        id: evidence
        if: always()
        shell: pwsh
        env:
          FETCH_OUTCOME: ${{ steps.fetch.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: |
          New-Item -ItemType Directory -Force docs/generated artifacts/body-fishing-discovery | Out-Null
          @'
          import json,os
          from pathlib import Path
          def load(path):
              p=Path(path)
              return json.loads(p.read_text(encoding='utf-8-sig')) if p.exists() else {}
          fetch=load('artifacts/body-fishing-discovery/fetch.json')
          probe=load('artifacts/body-fishing-discovery/fishing-probe.json')
          female=int(probe.get('FemaleFullFishingBanks',0))
          pipeline=(os.environ.get('FETCH_OUTCOME')=='success' and os.environ.get('BUILD_OUTCOME')=='success' and os.environ.get('PROBE_OUTCOME')=='success')
          gate='PASS' if pipeline and female>0 else ('UPSTREAM_FEMALE_FISHING_MISSING' if pipeline and female==0 else 'FAIL')
          lines=[
            '# ORIGINS-DxR — Official Female Fishing Discovery','',
            f'- Gate: **{gate}**',
            f'- Zircon authority: `{os.environ["ZIRCON_COMMIT"]}`',
            f'- Origins-DxR HEAD tested: `{os.environ.get("GITHUB_SHA","unknown")}`',
            f'- Female body libraries selected: **{fetch.get("selected","unknown")}**',
            f'- Downloaded successfully: **{fetch.get("ready","unknown")}**',
            f'- Not available from approved patch hosts: **{fetch.get("missing","unknown")}**',
            f'- Complete female fishing banks: **{female}**',
            '- Already proven separately: `M_Hum` male bank **5** (`+25000`) contains all FishingCast/Wait/Reel frames.',
            '- Pinned Assassin rule: `FishingCast/FishingWait/FishingReel` use `ArmourShift = +80` in addition to the Assassin body-bank shift.',
            '', '## Complete female fishing banks','',
            '| Library | Class family | Bank | Bank shift | ArmourShift | Effective fishing shift | Image count |',
            '|---|---|---:|---:|---:|---:|---:|',
          ]
          matches=[]
          for lib in probe.get('Libraries',[]):
              if lib.get('Gender')!='Female':
                  continue
              for bank in lib.get('Banks',[]):
                  if bank.get('Status')=='PASS':
                      matches.append((lib,bank))
                      lines.append(f'| {lib.get("LibraryFile")} | {lib.get("PlayerClassFamily")} | {bank.get("Bank")} | {bank.get("Shift")} | {lib.get("FishingArmourShift",0)} | {bank.get("EffectiveFishingShift", bank.get("Shift"))} | {lib.get("ImageCount")} |')
          if not matches:
              lines.append('| — | — | — | — | — | — | — |')
          lines += ['', '## Per-library summary','',
                    '| Library | Family | Download | Image count | Fishing ArmourShift | Complete banks | Partial banks | Empty banks |',
                    '|---|---|---|---:|---:|---:|---:|---:|']
          fetch_by={r.get('libraryFile'):r for r in fetch.get('libraries',[])}
          probe_by={r.get('LibraryFile'):r for r in probe.get('Libraries',[])}
          names=sorted(set(fetch_by)|set(probe_by))
          for name in names:
              fr=fetch_by.get(name,{})
              pr=probe_by.get(name,{})
              banks=pr.get('Banks',[])
              lines.append(f'| {name} | {pr.get("PlayerClassFamily","—")} | {fr.get("status","UNKNOWN")} | {pr.get("ImageCount","—")} | {pr.get("FishingArmourShift","—")} | {sum(b.get("Status")=="PASS" for b in banks)} | {sum(b.get("Status")=="PARTIAL" for b in banks)} | {sum(b.get("Status")=="EMPTY" for b in banks)} |')
          lines += ['', '## Interpretation','',
                    '- This probe reads only official female Zircon body `.Zl` files selected from the pinned `PlayerObject`/library contract.',
                    '- It checks the exact `FishingCast`, `FishingWait`, and `FishingReel` windows in all internal body banks and all 8 directions.',
                    '- For Assassin bodies it applies the exact pinned `ArmourShift = +80` before checking image slots.',
                    '- `PASS` means at least one complete official female bank exists and can be integrated without invented art.',
                    '- `UPSTREAM_FEMALE_FISHING_MISSING` means the complete official female body payload contains no valid bank; that is recorded as a Zircon asset gap, not repaired from Crystal or copied male art.',
                    '- Raw `.Zl` files are transient CI inputs and are not committed.']
          Path('docs/generated/ORIGINS_DXR_BODY_FISHING_DISCOVERY.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          Path('artifacts/body-fishing-discovery/gate.txt').write_text(gate+'\n',encoding='utf-8')
          '@ | python -

      - name: Upload discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: origins-dxr-female-body-fishing-discovery
          path: |
            artifacts/body-fishing-discovery/*.json
            artifacts/body-fishing-discovery/gate.txt
            docs/generated/ORIGINS_DXR_BODY_FISHING_DISCOVERY.md
          if-no-files-found: warn

      - name: Commit non-stale discovery report
        if: always()
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/generated/ORIGINS_DXR_BODY_FISHING_DISCOVERY.md
          if (git diff --cached --quiet) { exit 0 }
          git commit -m 'audit(dxr): record official female fishing discovery'
          git fetch origin Origins-DxR
          $remote=(git rev-parse origin/Origins-DxR).Trim()
          if ($remote -ne $env:GITHUB_SHA) {
            $changed=@(git diff --name-only $env:GITHUB_SHA $remote)
            $meaningful=@($changed | Where-Object { $_ -notlike 'docs/generated/*' })
            if ($meaningful.Count -gt 0) {
              Write-Host "Skipping stale evidence push; newer functional changes exist: $($meaningful -join ', ')"
              exit 0
            }
          }
          git pull --rebase origin Origins-DxR
          git push origin HEAD:Origins-DxR

      - name: Enforce discovery outcome
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path artifacts/body-fishing-discovery/gate.txt)) { throw 'Missing fishing discovery gate.' }
          $gate=(Get-Content artifacts/body-fishing-discovery/gate.txt -Raw).Trim()
          if ($gate -eq 'FAIL') { throw 'Female fishing discovery pipeline failed.' }
          if ($gate -eq 'UPSTREAM_FEMALE_FISHING_MISSING') {
            Write-Host 'No official female fishing bank exists in the downloaded pinned-Zircon body payload; recorded as upstream asset gap.'
            exit 0
          }
          if ($gate -ne 'PASS') { throw "Unexpected fishing discovery gate: $gate" }
