name: Origins DxR - Bichon Map 0 Real Zircon Render

on:
  push:
    branches: [Origins-DxR]
    paths:
      - 'maps/origins/0.map'
      - 'tools/zircon-map-renderer/**'
      - 'scripts/prepare-zircon-libraryeditor-managed-dxt.py'
      - '.github/workflows/origins-dxr-bichon-real-render.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: origins-dxr-bichon-real-render-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIRCON_COMMIT: cbf1aa919083bc13fc3f23f93772a8ab8370632d
  PRIMARY_PATCH: https://mirfiles.com/resources/mir3/zircon/patch/
  MIRROR_PATCH: https://mirfiles.co.uk/resources/mir3/zircon/patch/
  RAW_ROOT: runtime-assets/zircon-map-render
  OUT_ROOT: artifacts/bichon-real-render

jobs:
  render:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Bootstrap pinned Zircon
        id: bootstrap
        continue-on-error: true
        shell: pwsh
        run: |
          ./scripts/bootstrap-zircon.ps1
          $actual=(git -C vendor/zircon rev-parse HEAD).Trim()
          if ($actual -ne $env:ZIRCON_COMMIT) { throw "Pinned Zircon mismatch: $actual" }

      - name: Prepare managed DXT decoder
        id: dxt
        if: steps.bootstrap.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:OUT_ROOT | Out-Null
          python scripts/prepare-zircon-libraryeditor-managed-dxt.py `
            --zircon-root vendor/zircon `
            --report "$env:OUT_ROOT/managed-dxt.json"

      - name: Fetch official Zircon Map Data libraries
        id: fetch
        if: steps.dxt.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          @'
          import gzip,hashlib,json,os,urllib.parse,urllib.request
          from pathlib import Path

          root=Path(os.environ['RAW_ROOT'])
          relatives=[
            'Data/Map Data/Tilesc.Zl',
            'Data/Map Data/Tiles30c.Zl',
            'Data/Map Data/Tiles5c.Zl',
            'Data/Map Data/SmTilesc.Zl',
            'Data/Map Data/Housesc.Zl',
            'Data/Map Data/Cliffsc.Zl',
            'Data/Map Data/Dungeonsc.Zl',
            'Data/Map Data/Innersc.Zl',
            'Data/Map Data/Furnituresc.Zl',
            'Data/Map Data/Wallsc.Zl',
            'Data/Map Data/SmObjectsc.Zl',
            'Data/Map Data/Animationsc.Zl',
            'Data/Map Data/Object1c.Zl',
            'Data/Map Data/Object2c.Zl',
          ]
          hosts=[os.environ['MIRROR_PATCH'],os.environ['PRIMARY_PATCH']]
          rows=[]
          for relative in relatives:
              destination=root/Path(relative)
              destination.parent.mkdir(parents=True,exist_ok=True)
              patch=relative.replace('\\','/').replace('/','-')+'.gz'
              attempts=[]; ready=False
              for host in hosts:
                  url=host+urllib.parse.quote(patch,safe='-_.()')
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'ORIGINS-DxR-RealMapRenderer/1.0'})
                      with urllib.request.urlopen(req,timeout=90) as response:
                          compressed=response.read()
                      if not compressed.startswith(b'\x1f\x8b'):
                          raise RuntimeError('response is not gzip')
                      payload=gzip.decompress(compressed)
                      destination.write_bytes(payload)
                      rows.append({'relativePath':relative,'url':url,'bytes':len(payload),'sha256':hashlib.sha256(payload).hexdigest().upper()})
                      ready=True
                      break
                  except Exception as exc:
                      attempts.append({'url':url,'error':f'{type(exc).__name__}: {exc}'})
              if not ready:
                  rows.append({'relativePath':relative,'status':'FAIL','attempts':attempts})
                  Path(os.environ['OUT_ROOT'],'fetch.json').write_text(json.dumps({'status':'FAIL','libraries':rows},indent=2)+'\n',encoding='utf-8')
                  raise SystemExit(f'Unable to fetch official Zircon library: {relative}')
          Path(os.environ['OUT_ROOT'],'fetch.json').write_text(json.dumps({'status':'PASS','libraries':rows},indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'status':'PASS','libraryCount':len(rows)},indent=2))
          '@ | python -

      - name: Build native map renderer
        id: build
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: dotnet build tools/zircon-map-renderer/ZirconMapRenderer.csproj -c Release -p:Platform=AnyCPU

      - name: Render maps/origins/0.map with real Zircon assets
        id: render
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet run --project tools/zircon-map-renderer/ZirconMapRenderer.csproj `
            -c Release -p:Platform=AnyCPU --no-build -- `
            --map maps/origins/0.map `
            --source-root $env:RAW_ROOT `
            --output-dir $env:OUT_ROOT
          if ($LASTEXITCODE -ne 0) { throw "Native map renderer failed with $LASTEXITCODE" }

      - name: Validate real PNG renders
        id: validate
        if: steps.render.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          @'
          import hashlib,json,struct
          from pathlib import Path
          root=Path('artifacts/bichon-real-render')
          report=json.loads((root/'render-report.json').read_text(encoding='utf-8'))
          assert report['status']=='PASS'
          assert report['map']['sha256']=='83C6D36556576FDFFFA343892F3205BF31BEE5C3AFEF81293D15A591728978A8', report['map']['sha256']
          assert report['map']['width']==350 and report['map']['height']==350
          expected={'overview','detail'}
          got={row['name'] for row in report['renders']}
          assert got==expected,got
          for row in report['renders']:
              p=Path(row['path'])
              assert p.is_file() and p.stat().st_size>10000
              data=p.read_bytes()
              assert data[:8]==b'\x89PNG\r\n\x1a\n'
              w,h=struct.unpack('>II',data[16:24])
              assert w==row['pixelWidth'] and h==row['pixelHeight']
              assert hashlib.sha256(data).hexdigest().upper()==row['sha256']
          print(json.dumps({'status':'PASS','renders':report['renders']},indent=2))
          '@ | python -

      - name: Write render evidence
        id: evidence
        if: always()
        shell: pwsh
        env:
          BOOTSTRAP_OUTCOME: ${{ steps.bootstrap.outcome }}
          DXT_OUTCOME: ${{ steps.dxt.outcome }}
          FETCH_OUTCOME: ${{ steps.fetch.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          RENDER_OUTCOME: ${{ steps.render.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
        run: |
          New-Item -ItemType Directory -Force docs/generated | Out-Null
          @'
          import json,os
          from pathlib import Path
          root=Path('artifacts/bichon-real-render')
          report=json.loads((root/'render-report.json').read_text(encoding='utf-8')) if (root/'render-report.json').exists() else {}
          outcomes={
            'Bootstrap pinned Zircon':os.environ.get('BOOTSTRAP_OUTCOME','unknown'),
            'Managed DXT decoder':os.environ.get('DXT_OUTCOME','unknown'),
            'Fetch official Map Data .Zl':os.environ.get('FETCH_OUTCOME','unknown'),
            'Build native renderer':os.environ.get('BUILD_OUTCOME','unknown'),
            'Render real 0.map':os.environ.get('RENDER_OUTCOME','unknown'),
            'Validate PNG + map hash':os.environ.get('VALIDATE_OUTCOME','unknown'),
          }
          gate='PASS' if all(v=='success' for v in outcomes.values()) and report.get('status')=='PASS' else 'FAIL'
          lines=['# ORIGINS-DxR — Bichon Map 0 Real Zircon Render','',f'- Gate: **{gate}**',f'- HEAD tested: `{os.environ.get("GITHUB_SHA","unknown")}`',f'- Zircon authority: `{os.environ["ZIRCON_COMMIT"]}`',f'- GitHub run id: `{os.environ.get("GITHUB_RUN_ID","unknown")}`','', '## CI','', '| Check | Outcome |','|---|---|']
          lines += [f'| {k} | {v} |' for k,v in outcomes.items()]
          if report:
              lines += ['','## Source','',f'- Map: `{report["map"]["path"]}` — **{report["map"]["width"]}×{report["map"]["height"]}** cells.',f'- Map SHA-256: `{report["map"]["sha256"]}`.',f'- Map bytes: **{report["map"]["bytes"]}**.','', '## Rendered PNGs','', '| View | Cells | Scale | Pixels | PNG bytes | SHA-256 |','|---|---|---:|---:|---:|---|']
              for row in report['renders']:
                  lines.append(f'| {row["name"]} | `{row["x"]},{row["y"]}` + `{row["widthCells"]}×{row["heightCells"]}` | {row["scale"]} | {row["pixelWidth"]}×{row["pixelHeight"]} | {row["bytes"]} | `{row["sha256"]}` |')
              lines += ['','## Rendering contract','', '- Source is the committed `maps/origins/0.map`; no screenshot mock and no generated artwork.', '- Textures are downloaded from the official Zircon patch hosts as `Data/Map Data/*.Zl`.', '- Layer order and anchoring mirror pinned Zircon `Server/Views/MapViewer.cs`: Back → Middle → Front, Y-major draw order, tall objects anchored by image height, `useOffset=false`.', '- Animation is sampled at frame 0, matching the viewer when `Animation == 0`.', '- The render is therefore a deterministic visualization of the actual native map binary and official Zircon map assets.']
          Path('docs/generated/ORIGINS_DXR_BICHON_REAL_RENDER.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          '@ | python -

      - name: Upload real Bichon render
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: origins-dxr-bichon-map0-real-render
          path: |
            artifacts/bichon-real-render/bichon-cataclysm-real-overview.png
            artifacts/bichon-real-render/bichon-cataclysm-real-detail.png
            artifacts/bichon-real-render/render-report.json
            artifacts/bichon-real-render/fetch.json
            docs/generated/ORIGINS_DXR_BICHON_REAL_RENDER.md
          if-no-files-found: warn

      - name: Commit non-stale real render
        if: steps.validate.outcome == 'success'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force docs/generated/bichon-map0 | Out-Null
          Copy-Item "$env:OUT_ROOT/bichon-cataclysm-real-overview.png" docs/generated/bichon-map0/real-overview.png -Force
          Copy-Item "$env:OUT_ROOT/bichon-cataclysm-real-detail.png" docs/generated/bichon-map0/real-detail.png -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/generated/ORIGINS_DXR_BICHON_REAL_RENDER.md docs/generated/bichon-map0/real-overview.png docs/generated/bichon-map0/real-detail.png
          if (git diff --cached --quiet) { exit 0 }
          git commit -m 'docs(map): add real Zircon render of Bichon cataclysm'
          git fetch origin Origins-DxR
          $remote=(git rev-parse origin/Origins-DxR).Trim()
          if ($remote -ne $env:GITHUB_SHA) {
            $meaningful=(git diff --name-only $env:GITHUB_SHA $remote | Where-Object { $_ -notlike 'docs/generated/*' })
            if ($meaningful) { Write-Host "Skip stale real render due to newer functional changes: $meaningful"; exit 0 }
          }
          git pull --rebase origin Origins-DxR
          git push origin HEAD:Origins-DxR

      - name: Enforce real-render gate
        if: always()
        shell: pwsh
        run: |
          if ('${{ steps.validate.outcome }}' -ne 'success') { throw 'Real Bichon render gate failed.' }
