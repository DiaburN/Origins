name: Extract Crystal-Monk items by Server.Library reflection

on:
  push:
    branches:
      - research/monk-items-source
  pull_request:
    branches:
      - origins-game-v1
  workflow_dispatch:

jobs:
  extract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and extract Crystal-Monk Server release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path research_out | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/JevLOMCN/Crystal-Monk/releases/download/Server/Server.rar' -OutFile 'research_out/Server.rar'
          7z x -y 'research_out/Server.rar' '-oresearch_out/release' | Out-Null

      - name: Load exact netstandard Server.Library and exact release database
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $outDir = Join-Path $env:GITHUB_WORKSPACE 'research_out'
          $serverDir = (Resolve-Path 'research_out/release/Server').Path
          Set-Location $serverDir
          $assemblyPath = Join-Path $serverDir 'netstandard2.0/Server.Library.dll'
          $asm = [System.Reflection.Assembly]::LoadFrom($assemblyPath)
          $asm.FullName | Tee-Object -FilePath (Join-Path $outDir 'assembly.txt') | Write-Host
          $types = $asm.GetTypes() | Sort-Object FullName
          $types.FullName | Set-Content -Encoding UTF8 (Join-Path $outDir 'types.txt')
          $types | Where-Object { $_.FullName -match 'Envir|ItemInfo|Database' } | Select-Object -ExpandProperty FullName | Tee-Object -FilePath (Join-Path $outDir 'candidate_types.txt') | Write-Host

          $envirType = $asm.GetType('Server.MirEnvir.Envir', $false)
          if (-not $envirType) {
            $envirType = $types | Where-Object { $_.Name -eq 'Envir' -and $_.GetField('ItemInfoList') } | Select-Object -First 1
          }
          if (-not $envirType) { throw 'Envir type with ItemInfoList not found in netstandard Server.Library.dll' }
          Write-Host "Envir type: $($envirType.FullName)"
          $envir = [Activator]::CreateInstance($envirType)
          $load = $envirType.GetMethod('LoadDB', [System.Reflection.BindingFlags]'Instance,Public,NonPublic')
          if (-not $load) { throw 'LoadDB method not found' }
          $load.Invoke($envir, @()) | Out-Null

          $itemsField = $envirType.GetField('ItemInfoList', [System.Reflection.BindingFlags]'Instance,Public,NonPublic')
          if (-not $itemsField) { throw 'ItemInfoList field not found' }
          $dict = $itemsField.GetValue($envir)
          Write-Host "Loaded item count: $($dict.Count)"

          $first = $dict.Values | Select-Object -First 1
          $itemType = $first.GetType()
          Write-Host "Item type: $($itemType.FullName)"
          $pubFields = $itemType.GetFields([System.Reflection.BindingFlags]'Instance,Public')
          $pubProps = $itemType.GetProperties([System.Reflection.BindingFlags]'Instance,Public') | Where-Object { $_.GetIndexParameters().Count -eq 0 }
          $pubFields.Name | Sort-Object | Set-Content -Encoding UTF8 (Join-Path $outDir 'item_fields.txt')
          $pubProps.Name | Sort-Object | Set-Content -Encoding UTF8 (Join-Path $outDir 'item_properties.txt')

          function Convert-Value($value) {
            if ($null -eq $value) { return $null }
            $t = $value.GetType()
            if ($t.IsEnum) { return $value.ToString() }
            if ($value -is [System.Drawing.Color]) { return $value.Name }
            if ($value -is [System.Collections.IDictionary]) {
              $o=[ordered]@{}; foreach($k in $value.Keys){$o[$k.ToString()] = Convert-Value $value[$k]}; return [pscustomobject]$o
            }
            if ($value -is [System.Collections.IEnumerable] -and -not ($value -is [string])) {
              $arr = @(); foreach ($x in $value) { $arr += (Convert-Value $x) }; return $arr
            }
            return $value
          }

          function Item-ToObject($item) {
            $o = [ordered]@{}
            foreach ($f in $pubFields) {
              try { $o[$f.Name] = Convert-Value ($f.GetValue($item)) } catch { $o[$f.Name] = "<ERROR:$($_.Exception.Message)>" }
            }
            foreach ($p in $pubProps) {
              if ($o.Contains($p.Name)) { continue }
              try { $o[$p.Name] = Convert-Value ($p.GetValue($item, $null)) } catch { }
            }
            return [pscustomobject]$o
          }

          $rcField = $itemType.GetField('RequiredClass', [System.Reflection.BindingFlags]'Instance,Public,NonPublic')
          $rcProp = $itemType.GetProperty('RequiredClass', [System.Reflection.BindingFlags]'Instance,Public,NonPublic')
          $monk = @()
          foreach ($item in $dict.Values) {
            $rc = if ($rcField) { $rcField.GetValue($item) } elseif ($rcProp) { $rcProp.GetValue($item) } else { $null }
            if ($null -ne $rc -and $rc.ToString() -eq 'Monk') { $monk += (Item-ToObject $item) }
          }
          $monk = @($monk | Sort-Object Index)
          $monk | ConvertTo-Json -Depth 10 | Set-Content -Encoding UTF8 (Join-Path $outDir 'monk_items.json')
          $monk | Export-Csv -NoTypeInformation -Encoding UTF8 (Join-Path $outDir 'monk_items_full.csv')
          $summary = $monk | Select-Object Index,Name,FriendlyName,Type,Shape,RequiredClass,RequiredType,RequiredAmount,Set,Weight,Durability,MinAC,MaxAC,MinMAC,MaxMAC,MinDC,MaxDC,MinMC,MaxMC,MinSC,MaxSC,Image
          $summary | Export-Csv -NoTypeInformation -Encoding UTF8 (Join-Path $outDir 'monk_items.csv')
          $summary | Format-Table -AutoSize | Out-String -Width 500 | Tee-Object -FilePath (Join-Path $outDir 'monk_items.txt') | Write-Host
          Write-Host "Monk item count: $($monk.Count)"

      - name: Upload extracted item records and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crystal-monk-exact-items
          path: |
            research_out/*.txt
            research_out/*.json
            research_out/*.csv
          if-no-files-found: warn
