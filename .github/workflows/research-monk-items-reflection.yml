name: Extract Crystal-Monk items by Server reflection

on:
  push:
    branches:
      - research/monk-items-source
  pull_request:
    branches:
      - origins-game-v1
  workflow_dispatch:

jobs:
  extract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and extract Crystal-Monk Server release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path research_out | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/JevLOMCN/Crystal-Monk/releases/download/Server/Server.rar' -OutFile 'research_out/Server.rar'
          7z x -y 'research_out/Server.rar' '-oresearch_out/release' | Out-Null
          Get-ChildItem -Path research_out/release -Recurse -Filter Server.MirDB | Select-Object FullName,Length | Format-Table -AutoSize

      - name: Load exact release database with exact release Server assembly
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $serverDir = (Resolve-Path 'research_out/release/Server').Path
          Set-Location $serverDir
          $assemblyPath = Join-Path $serverDir 'Server.exe'
          $asm = [System.Reflection.Assembly]::LoadFrom($assemblyPath)

          $envirType = $asm.GetType('Server.MirEnvir.Envir', $true)
          $envir = [Activator]::CreateInstance($envirType)
          $load = $envirType.GetMethod('LoadDB', [System.Reflection.BindingFlags]'Instance,Public')
          if (-not $load) { throw 'LoadDB method not found' }
          $load.Invoke($envir, @()) | Out-Null

          $itemsField = $envirType.GetField('ItemInfoList', [System.Reflection.BindingFlags]'Instance,Public')
          $dict = $itemsField.GetValue($envir)
          Write-Host "Loaded item count: $($dict.Count)"

          $first = $dict.Values | Select-Object -First 1
          $itemType = $first.GetType()
          $pubFields = $itemType.GetFields([System.Reflection.BindingFlags]'Instance,Public')
          $pubProps = $itemType.GetProperties([System.Reflection.BindingFlags]'Instance,Public') | Where-Object { $_.GetIndexParameters().Count -eq 0 }
          $pubFields.Name | Sort-Object | Set-Content -Encoding UTF8 (Join-Path $env:GITHUB_WORKSPACE 'research_out/item_fields.txt')
          $pubProps.Name | Sort-Object | Set-Content -Encoding UTF8 (Join-Path $env:GITHUB_WORKSPACE 'research_out/item_properties.txt')

          function Convert-Value($value) {
            if ($null -eq $value) { return $null }
            $t = $value.GetType()
            if ($t.IsEnum) { return $value.ToString() }
            if ($value -is [System.Drawing.Color]) { return $value.Name }
            if ($value -is [System.Collections.IEnumerable] -and -not ($value -is [string])) {
              $arr = @()
              foreach ($x in $value) { $arr += (Convert-Value $x) }
              return $arr
            }
            return $value
          }

          function Item-ToObject($item) {
            $o = [ordered]@{}
            foreach ($f in $pubFields) {
              try { $o[$f.Name] = Convert-Value ($f.GetValue($item)) } catch { $o[$f.Name] = "<ERROR:$($_.Exception.Message)>" }
            }
            foreach ($p in $pubProps) {
              if ($o.Contains($p.Name)) { continue }
              try { $o[$p.Name] = Convert-Value ($p.GetValue($item, $null)) } catch { }
            }
            return [pscustomobject]$o
          }

          $all = @()
          $monk = @()
          foreach ($item in $dict.Values) {
            $obj = Item-ToObject $item
            $all += $obj
            $rcField = $itemType.GetField('RequiredClass', [System.Reflection.BindingFlags]'Instance,Public')
            if ($rcField) {
              $rc = $rcField.GetValue($item)
              if ($null -ne $rc -and $rc.ToString() -eq 'Monk') { $monk += $obj }
            }
          }

          $outDir = Join-Path $env:GITHUB_WORKSPACE 'research_out'
          $all | Sort-Object Index | ConvertTo-Json -Depth 8 | Set-Content -Encoding UTF8 (Join-Path $outDir 'all_items.json')
          $monk | Sort-Object Index | ConvertTo-Json -Depth 8 | Set-Content -Encoding UTF8 (Join-Path $outDir 'monk_items.json')

          $summary = @()
          foreach ($i in ($monk | Sort-Object Index)) {
            $summary += [pscustomobject]@{
              Index = $i.Index
              InternalName = $i.Name
              FriendlyName = $i.FriendlyName
              Type = $i.Type
              Shape = $i.Shape
              RequiredType = $i.RequiredType
              RequiredClass = $i.RequiredClass
              RequiredAmount = $i.RequiredAmount
              Set = $i.Set
              Weight = $i.Weight
              Durability = $i.Durability
              MinAC = $i.MinAC
              MaxAC = $i.MaxAC
              MinMAC = $i.MinMAC
              MaxMAC = $i.MaxMAC
              MinDC = $i.MinDC
              MaxDC = $i.MaxDC
              MinMC = $i.MinMC
              MaxMC = $i.MaxMC
              MinSC = $i.MinSC
              MaxSC = $i.MaxSC
              Image = $i.Image
            }
          }
          $summary | Export-Csv -NoTypeInformation -Encoding UTF8 (Join-Path $outDir 'monk_items.csv')
          $summary | Format-Table -AutoSize | Out-String -Width 400 | Tee-Object -FilePath (Join-Path $outDir 'monk_items.txt') | Write-Host
          Write-Host "Monk item count: $($monk.Count)"

      - name: Upload extracted item records
        uses: actions/upload-artifact@v4
        with:
          name: crystal-monk-exact-items
          path: |
            research_out/item_fields.txt
            research_out/item_properties.txt
            research_out/monk_items.json
            research_out/monk_items.csv
            research_out/monk_items.txt
          if-no-files-found: error
