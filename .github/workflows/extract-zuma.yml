name: Extract Zuma assets

# ORIGINS Map Engine public-source extraction
on:
  push:
    branches:
      - map-engine-v1
      - origins-game-v1
    paths:
      - ".github/workflows/extract-zuma.yml"
      - "tools/crystal-map-importer/**"
      - "origins/map-engine/themes/zuma/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-zuma:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare source folders
        run: mkdir -p .source/WemadeMir2 .source/maps .source/downloads
      - name: Download Crystal Database maps
        run: |
          curl -fL --retry 4 --retry-delay 3 https://raw.githubusercontent.com/Suprcode/Crystal.Database/main/Jev/Maps/d501.map -o .source/maps/d501.map
          curl -fL --retry 4 --retry-delay 3 https://raw.githubusercontent.com/Suprcode/Crystal.Database/main/Jev/Maps/d515.map -o .source/maps/d515.map
      - name: Download public WemadeMir2 libraries
        run: |
          BASE="https://files.lomcn.co.uk/resources/mir2/crystal/patch_oldversion/Data/Map/WeMade-Mir2"
          UA="Mozilla/5.0 (ORIGINS CI)"
          for LIB in SmTiles Objects2 Objects6 Tiles; do
            curl -fL --retry 5 --retry-delay 4 -A "$UA" "$BASE/${LIB}.Lib.gz" -o ".source/downloads/${LIB}.Lib.gz"
            gzip -dc ".source/downloads/${LIB}.Lib.gz" > ".source/WemadeMir2/${LIB}.Lib"
          done
      - name: Extract Zuma source images
        run: |
          rm -rf artifacts/zuma
          python3 tools/crystal-map-importer/extract_theme_assets_complete.py --data .source/WemadeMir2 --maps .source/maps --standard d501.map --king d515.map --theme zuma_gray --out artifacts/zuma
          mkdir -p artifacts/zuma/reference
          python3 tools/crystal-map-importer/render_mir2_2010_reference.py --data .source/WemadeMir2 --map .source/maps/d515.map --out artifacts/zuma/reference/d515-full.png
          python3 tools/crystal-map-importer/export_mir2_2010_placements.py --data .source/WemadeMir2 --map .source/maps/d515.map --out artifacts/zuma/reference/d515-placements.json
      - uses: actions/upload-artifact@v4
        with:
          name: zuma-extracted
          path: artifacts/zuma
          if-no-files-found: error
          retention-days: 14
