name: Spell Patch Syntax

on:
  push:
    branches:
      - work/spells-final-audit
    paths:
      - 'patches/zircon/**'
      - 'scripts/validate-zircon-patches.py'
      - '.github/workflows/spells-patch-syntax.yml'
  workflow_dispatch:

concurrency:
  group: spell-patch-syntax-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ORIGINS
        uses: actions/checkout@v4
      - name: Validate all Zircon patch hunks
        run: python3 scripts/validate-zircon-patches.py patches/zircon
