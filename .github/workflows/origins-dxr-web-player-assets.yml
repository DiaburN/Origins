name: Origins DxR - Web Player Assets Step 2

on:
  push:
    branches: [Origins-DxR]
    paths:
      - 'apps/origins-web-runtime/main.js'
      - 'apps/origins-web-runtime/player-animation-runtime.js'
      - 'apps/origins-web-runtime/player-sprite-runtime.js'
      - 'apps/origins-web-runtime/tests/player-animation-runtime.test.mjs'
      - 'apps/origins-web-runtime/tests/player-sprite-runtime.test.mjs'
      - 'scripts/generate-zircon-web-player-contract.py'
      - 'scripts/audit-origins-web-player-assets.py'
      - 'tools/zircon-web-asset-exporter/**'
      - '.github/workflows/origins-dxr-web-player-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: origins-dxr-web-player-assets-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIRCON_COMMIT: cbf1aa919083bc13fc3f23f93772a8ab8370632d
  CONTRACT_JSON: apps/origins-web-runtime/generated/zircon-player-asset-contract.json
  CONTRACT_JS: apps/origins-web-runtime/generated/zircon-player-asset-contract.generated.js

jobs:
  web-player-assets-step2:
    runs-on: windows-latest
    steps:
      - name: Checkout Origins-DxR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Bootstrap pinned Zircon
        id: bootstrap
        continue-on-error: true
        shell: pwsh
        run: |
          ./scripts/bootstrap-zircon.ps1
          $actual = (git -C vendor/zircon rev-parse HEAD).Trim()
          if ($actual -ne $env:ZIRCON_COMMIT) { throw "Pinned Zircon mismatch: $actual" }

      - name: Generate player animation and library contract
        id: generate
        continue-on-error: true
        shell: pwsh
        run: |
          python scripts/generate-zircon-web-player-contract.py `
            --zircon-root vendor/zircon `
            --commit $env:ZIRCON_COMMIT `
            --json-output $env:CONTRACT_JSON `
            --js-output $env:CONTRACT_JS

      - name: JavaScript syntax checks
        id: syntax
        continue-on-error: true
        shell: pwsh
        run: |
          node --check $env:CONTRACT_JS
          node --check apps/origins-web-runtime/player-animation-runtime.js
          node --check apps/origins-web-runtime/player-sprite-runtime.js
          node --check apps/origins-web-runtime/main.js

      - name: Full player animation and sprite unit tests
        id: tests
        continue-on-error: true
        shell: pwsh
        run: |
          node --test apps/origins-web-runtime/tests/player-animation-runtime.test.mjs apps/origins-web-runtime/tests/player-sprite-runtime.test.mjs

      - name: Audit Step 2 against pinned PlayerObject
        id: audit
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/web-player-assets | Out-Null
          python scripts/audit-origins-web-player-assets.py `
            --contract $env:CONTRACT_JSON `
            --runtime apps/origins-web-runtime/player-animation-runtime.js `
            --sprite-runtime apps/origins-web-runtime/player-sprite-runtime.js `
            --main-runtime apps/origins-web-runtime/main.js `
            --exporter tools/zircon-web-asset-exporter/Program.cs `
            --player-source vendor/zircon/Client/Models/PlayerObject.cs `
            --map-source vendor/zircon/Client/Models/MapObject.cs `
            --functions-source vendor/zircon/LibraryCore/Functions.cs `
            --output artifacts/web-player-assets/audit.json

      - name: Build real ZL to web atlas exporter
        id: exporter
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet build tools/zircon-web-asset-exporter/ZirconWebAssetExporter.csproj `
            -c Release -p:Platform=AnyCPU

      - name: Probe paired M-Hum and WM-Hum payload
        id: basehumans
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/web-player-assets | Out-Null
          dotnet run --project tools/zircon-web-asset-exporter/ZirconWebAssetExporter.csproj `
            -c Release -p:Platform=AnyCPU --no-build -- `
            --contract $env:CONTRACT_JSON `
            --source-root runtime-assets/zircon `
            --base-humans `
            --probe `
            --report artifacts/web-player-assets/base-human-payload-probe.json

      - name: Probe all real Zircon player payload
        id: payload
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/web-player-assets | Out-Null
          dotnet run --project tools/zircon-web-asset-exporter/ZirconWebAssetExporter.csproj `
            -c Release -p:Platform=AnyCPU --no-build -- `
            --contract $env:CONTRACT_JSON `
            --source-root runtime-assets/zircon `
            --probe `
            --report artifacts/web-player-assets/payload-probe.json

      - name: Write Step 2 evidence report
        id: report
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force docs/generated | Out-Null
          New-Item -ItemType Directory -Force artifacts/web-player-assets | Out-Null
          @'
          import json
          import os
          from pathlib import Path

          outcomes = {
              'Bootstrap pinned Zircon': '${{ steps.bootstrap.outcome }}',
              'Generate source-faithful contract': '${{ steps.generate.outcome }}',
              'JavaScript syntax': '${{ steps.syntax.outcome }}',
              'Player animation + sprite tests': '${{ steps.tests.outcome }}',
              'Pinned PlayerObject + main runtime audit': '${{ steps.audit.outcome }}',
              'ZL atlas exporter build': '${{ steps.exporter.outcome }}',
              'M-Hum + WM-Hum pair probe': '${{ steps.basehumans.outcome }}',
              'All-player payload probe': '${{ steps.payload.outcome }}',
          }
          pipeline_gate = 'PASS' if all(value == 'success' for value in outcomes.values()) else 'FAIL'

          audit_path = Path('artifacts/web-player-assets/audit.json')
          probe_path = Path('artifacts/web-player-assets/payload-probe.json')
          base_probe_path = Path('artifacts/web-player-assets/base-human-payload-probe.json')
          audit = json.loads(audit_path.read_text(encoding='utf-8')) if audit_path.exists() else {'checks': []}
          probe = json.loads(probe_path.read_text(encoding='utf-8')) if probe_path.exists() else {}
          base_probe = json.loads(base_probe_path.read_text(encoding='utf-8')) if base_probe_path.exists() else {}
          payload_status = probe.get('status', 'UNKNOWN')
          base_status = base_probe.get('status', 'UNKNOWN')
          visual_status = 'READY' if base_status == 'READY' else 'BLOCKED_MISSING_ZL'

          lines = [
              '# ORIGINS-DxR — Web Player Assets Step 2',
              '',
              f'- Pipeline gate: **{pipeline_gate}**',
              f'- Base humans M-Hum + WM-Hum: **{base_status}**',
              f'- Full Zircon player payload: **{payload_status}**',
              f'- Real base sprite binding status: **{visual_status}**',
              f'- Origins-DxR HEAD tested: {os.environ.get("GITHUB_SHA", "unknown")}',
              f'- Zircon authority: {os.environ["ZIRCON_COMMIT"]}',
              '',
              '## What is implemented',
              '',
              '- `M_Hum` (male) and `WM_Hum` (female) are one paired base-human import profile. They share the same native player animation contract; gender selects only the body library.',
              '- `FrameSet.Players` is generated directly from pinned Zircon source, not transcribed from Crystal.',
              '- All 42 native player animation frame definitions are represented with exact start indices, direction offsets, frame counts, per-frame delays, `Reversed` and `StaticSpeed`.',
              '- `Functions.GetMagicAnimation` cases are generated from pinned source.',
              '- Player action resolver covers the direct native `PlayerObject.SetAnimation` actions and deliberately refuses fabricated direct Show/Hide/Mount/Idle mappings.',
              '- Attack resolver preserves Zircon class/weapon/magic animation choices.',
              '- Assassin armour shifts and body/hair/helmet/weapon/shield/horse frame composition are represented.',
              '- PlayerObject library selectors and direction-aware layer ordering are preserved, including dual weapons, shields and costume weapon-hiding rules.',
              '- `.Zl` exporter uses pinned `LibraryEditor.Mir3Library`, creates transparent PNG atlas pages, and preserves image index + OffSetX/OffSetY.',
              '- `--base-humans` exports M_Hum and WM_Hum together and refuses a partial pair.',
              '- Browser sprite store maps `Male -> M_Hum` and `Female -> WM_Hum` and exposes pair readiness.',
              '- The actual web runtime auto-renders the corresponding native base body whenever the complete pair is READY; otherwise it keeps the diagnostic marker and does not fabricate a sprite.',
              '',
              '## CI',
              '',
              '| Check | Result |',
              '|---|---|',
          ]
          for name, value in outcomes.items():
              lines.append(f'| {name} | {value} |')

          lines.extend([
              '',
              '## Contract totals',
              '',
              f'- Player animations: **{audit.get("frameCount", 0)}**',
              f'- Magic-to-body-animation cases: **{audit.get("magicAnimationCases", 0)}**',
              f'- Player-related Zircon libraries: **{audit.get("playerLibraryCount", 0)}**',
              f'- PlayerObject selector entries: **{audit.get("selectorCount", 0)}**',
              f'- Base human `.Zl` present: **{base_probe.get("present", 0)} / {base_probe.get("required", 0)}**',
              f'- All player `.Zl` present: **{probe.get("present", 0)} / {probe.get("required", 0)}**',
              '',
              '## Base human pair',
              '',
          ])
          for item in base_probe.get('libraries', []):
              lines.append(f'- `{item.get("libraryFile")}` → `{item.get("sourcePath")}`: **{"PRESENT" if item.get("present") else "MISSING"}**')

          lines.extend([
              '',
              '## Source parity audit',
              '',
              '| Check | Result | Details |',
              '|---|---|---|',
          ])
          for item in audit.get('checks', []):
              detail = str(item.get('details', '')).replace('|', '\\|')
              result = 'PASS' if item.get('pass') else 'FAIL'
              lines.append(f'| {item.get("name", "unknown")} | {result} | {detail} |')

          lines.extend([
              '',
              '## Real payload boundary',
              '',
              'The source repository defines both native base body libraries as `Data/M-Hum.Zl` and `Data/WM-Hum.Zl`, but those binary payloads are not committed to Origins-DxR. They are never replaced with Crystal or invented art.',
              '',
              'As soon as both files exist under `runtime-assets/zircon/Data/`, the exact same `--base-humans` exporter generates the male and female web atlases in one operation. No second female animation implementation is required.',
          ])

          Path('docs/generated/ORIGINS_DXR_WEB_PLAYER_ASSETS_STEP2.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          Path('artifacts/web-player-assets/pipeline-gate.txt').write_text(pipeline_gate + '\n', encoding='utf-8')
          print(pipeline_gate, base_status, payload_status)
          '@ | python -

      - name: Upload Step 2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: origins-dxr-web-player-assets-step2
          path: artifacts/web-player-assets/
          if-no-files-found: warn

      - name: Commit generated contract and evidence
        if: always()
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $paths = @(
            $env:CONTRACT_JSON,
            $env:CONTRACT_JS,
            'docs/generated/ORIGINS_DXR_WEB_PLAYER_ASSETS_STEP2.md'
          ) | Where-Object { Test-Path $_ }
          if ($paths.Count -gt 0) { git add -- $paths }
          if (git diff --cached --quiet) {
            Write-Host 'Generated contract/evidence unchanged.'
          } else {
            git commit -m 'audit(dxr): record web player asset Step 2'
            git pull --rebase origin Origins-DxR
            git push origin HEAD:Origins-DxR
          }

      - name: Enforce Step 2 pipeline gate
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path artifacts/web-player-assets/pipeline-gate.txt)) { throw 'Missing Step 2 gate result.' }
          $gate = (Get-Content artifacts/web-player-assets/pipeline-gate.txt -Raw).Trim()
          if ($gate -ne 'PASS') { throw "Step 2 pipeline gate is $gate" }
