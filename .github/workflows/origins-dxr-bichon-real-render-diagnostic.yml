name: Origins DxR - Forest F1 Real Zircon Render

on:
  push:
    branches: [Origins-DxR]
    paths:
      - 'maps/origins/forest/forest_f1.map.gz.b64'
      - 'tools/zircon-map-renderer/**'
      - '.github/workflows/origins-dxr-bichon-real-render-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: origins-dxr-forest-f1-real-render-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIRCON_COMMIT: cbf1aa919083bc13fc3f23f93772a8ab8370632d
  MIRROR_PATCH: https://mirfiles.co.uk/resources/mir3/zircon/patch/
  PRIMARY_PATCH: https://mirfiles.com/resources/mir3/zircon/patch/
  RAW_ROOT: runtime-assets/zircon-map-render
  FOREST_ROOT: artifacts/forest-room-real
  EXPECTED_MAP_SHA256: 695109A7020E1E51D19CF1D47EAEC49C9519B1AD9B8EB7F0646052FEF415DE0C

jobs:
  render:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Bootstrap pinned Zircon
        id: bootstrap
        shell: pwsh
        run: |
          ./scripts/bootstrap-zircon.ps1
          $actual=(git -C vendor/zircon rev-parse HEAD).Trim()
          if ($actual -ne $env:ZIRCON_COMMIT) { throw "Pinned Zircon mismatch: $actual" }

      - name: Prepare managed DXT decoder
        id: dxt
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:FOREST_ROOT | Out-Null
          python scripts/prepare-zircon-libraryeditor-managed-dxt.py `
            --zircon-root vendor/zircon `
            --report "$env:FOREST_ROOT/managed-dxt.json"

      - name: Fetch exact official Zircon libraries used by Forest F1
        id: fetch
        shell: pwsh
        run: |
          @'
          import gzip,hashlib,json,os,urllib.parse,urllib.request
          from pathlib import Path

          rels=[
            'Data/Map Data/Tilesc.Zl',
            'Data/Map Data/Tiles30c.Zl',
            'Data/Map Data/Tiles5c.Zl',
            'Data/Map Data/Cliffsc.Zl',
            'Data/Map Data/SmObjectsc.Zl',
            'Data/Map Data/Animationsc.Zl',
            'Data/Map Data/Wood/Tilesc.Zl',
          ]
          hosts=[os.environ['MIRROR_PATCH'],os.environ['PRIMARY_PATCH']]
          root=Path(os.environ['RAW_ROOT'])
          rows=[]
          for rel in rels:
              dest=root/Path(rel)
              dest.parent.mkdir(parents=True,exist_ok=True)
              patch=rel.replace('/','-')+'.gz'
              attempts=[]
              for host in hosts:
                  url=host+urllib.parse.quote(patch,safe='-_.()')
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'ORIGINS-DxR-ForestF1/2.0'})
                      with urllib.request.urlopen(req,timeout=120) as response:
                          compressed=response.read()
                      if not compressed.startswith(b'\x1f\x8b'):
                          raise RuntimeError('response is not gzip')
                      payload=gzip.decompress(compressed)
                      dest.write_bytes(payload)
                      rows.append({'relativePath':rel,'status':'READY','bytes':len(payload),'sha256':hashlib.sha256(payload).hexdigest().upper(),'url':url})
                      break
                  except Exception as exc:
                      attempts.append({'url':url,'error':f'{type(exc).__name__}: {exc}'})
              else:
                  rows.append({'relativePath':rel,'status':'FAIL','attempts':attempts})
                  Path(os.environ['FOREST_ROOT'],'fetch.json').write_text(json.dumps({'status':'FAIL','files':rows},indent=2)+'\n',encoding='utf-8')
                  raise SystemExit(f'Unable to fetch official Zircon library: {rel}')
          Path(os.environ['FOREST_ROOT'],'fetch.json').write_text(json.dumps({'status':'PASS','files':rows},indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'status':'PASS','libraries':len(rows)},indent=2))
          '@ | python -

      - name: Decode native Forest F1 derived from user Bichon 800x800 map
        id: decode
        shell: pwsh
        run: |
          @'
          import base64,gzip,hashlib,json,os,struct
          from pathlib import Path

          carrier=Path('maps/origins/forest/forest_f1.map.gz.b64')
          payload=gzip.decompress(base64.b64decode(carrier.read_text(encoding='ascii').strip()))
          w,h=struct.unpack_from('<HH',payload,22)
          expected=28+(w//2)*(h//2)*3+w*h*14
          digest=hashlib.sha256(payload).hexdigest().upper()
          assert (w,h)==(80,128),(w,h)
          assert len(payload)==expected,(len(payload),expected)
          assert digest==os.environ['EXPECTED_MAP_SHA256'],(digest,os.environ['EXPECTED_MAP_SHA256'])
          root=Path(os.environ['FOREST_ROOT']); root.mkdir(parents=True,exist_ok=True)
          (root/'forest_f1.map').write_bytes(payload)
          report={
            'schema':'origins.forest-f1.user-bichon800.v2',
            'source':'User-provided Bichon 0.map, 800x800',
            'output':{'width':w,'height':h,'bytes':len(payload),'sha256':digest,'spawn':[40,104]},
            'usedKROrderIds':[0,1,2,5,10,11,15],
            'caveTargetRegion':[[39,29],[40,29],[39,30],[40,30],[40,31],[40,32]],
            'contract':[
              'Map binary was constructed from cells copied from the user-provided 800x800 Bichon 0.map.',
              'No generated artwork or invented ImageID is used.',
              'The real preview must be rendered with official Zircon .Zl libraries.'
            ]
          }
          (root/'build-report.json').write_text(json.dumps(report,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(report,indent=2))
          '@ | python -

      - name: Build native Zircon renderer
        id: build
        shell: pwsh
        run: dotnet build tools/zircon-map-renderer/ZirconMapRenderer.csproj -c Release -p:Platform=AnyCPU

      - name: Render Forest F1 with real Zircon tiles
        id: render_forest
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:FOREST_ROOT/render" | Out-Null
          dotnet run --project tools/zircon-map-renderer/ZirconMapRenderer.csproj `
            -c Release -p:Platform=AnyCPU --no-build -- `
            --map "$env:FOREST_ROOT/forest_f1.map" `
            --source-root $env:RAW_ROOT `
            --output-dir "$env:FOREST_ROOT/render"
          if ($LASTEXITCODE -ne 0) { throw "Forest F1 native renderer failed with $LASTEXITCODE" }

      - name: Validate native map and real PNG
        id: validate
        shell: pwsh
        run: |
          @'
          import hashlib,json,os,struct
          from pathlib import Path
          root=Path(os.environ['FOREST_ROOT'])
          mp=root/'forest_f1.map'; data=mp.read_bytes()
          w,h=struct.unpack_from('<HH',data,22)
          expected=28+(w//2)*(h//2)*3+w*h*14
          assert (w,h)==(80,128),(w,h)
          assert len(data)==expected,(len(data),expected)
          assert hashlib.sha256(data).hexdigest().upper()==os.environ['EXPECTED_MAP_SHA256']
          png=root/'render'/'bichon-cataclysm-real-overview.png'
          assert png.is_file() and png.stat().st_size>10000,png
          assert png.read_bytes()[:8]==b'\x89PNG\r\n\x1a\n'
          rr=json.loads((root/'render'/'render-report.json').read_text(encoding='utf-8'))
          assert rr['status']=='PASS'
          assert rr['map']['width']==80 and rr['map']['height']==128
          print(json.dumps({'status':'PASS','mapBytes':len(data),'previewBytes':png.stat().st_size,'previewSHA256':hashlib.sha256(png.read_bytes()).hexdigest().upper()},indent=2))
          '@ | python -

      - name: Commit real map and real Zircon preview
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force maps/origins/forest | Out-Null
          New-Item -ItemType Directory -Force docs/generated/forest-room | Out-Null
          Copy-Item "$env:FOREST_ROOT/forest_f1.map" maps/origins/forest/forest_f1.map -Force
          Copy-Item "$env:FOREST_ROOT/render/bichon-cataclysm-real-overview.png" docs/generated/forest-room/real-overview.png -Force
          Copy-Item "$env:FOREST_ROOT/build-report.json" docs/generated/forest-room/build-report.json -Force
          Copy-Item "$env:FOREST_ROOT/render/render-report.json" docs/generated/forest-room/render-report.json -Force

          @'
          import json,os
          from pathlib import Path
          root=Path(os.environ['FOREST_ROOT'])
          b=json.loads((root/'build-report.json').read_text(encoding='utf-8'))
          r=json.loads((root/'render'/'render-report.json').read_text(encoding='utf-8'))
          ov=next(x for x in r['renders'] if x['name']=='overview')
          lines=[
            '# ORIGINS-DxR — Forest F1 Real Zircon Render','',
            '- Gate: **PASS**',
            '- Source map geometry/cells: **user Bichon 0.map 800×800**.',
            '- Graphics: **official Zircon `.Zl` map libraries**.',
            '- Generated artwork: **none**.','',
            '## Native map','',
            f'- Size: **{b["output"]["width"]}×{b["output"]["height"]}** cells.',
            f'- Bytes: **{b["output"]["bytes"]}**.',
            f'- SHA-256: `{b["output"]["sha256"]}`.',
            f'- Spawn proposal: `{b["output"]["spawn"]}`.',
            f'- KROrder IDs: `{b["usedKROrderIds"]}`.','',
            '## Real preview','',
            f'- Pixels: **{ov["pixelWidth"]}×{ov["pixelHeight"]}**.',
            f'- PNG bytes: **{ov["bytes"]}**.',
            f'- SHA-256: `{ov["sha256"]}`.','',
            'Rendering uses the native ORIGINS Zircon renderer with Back → Middle → Front ordering and the official map libraries downloaded from the Zircon patch hosts.'
          ]
          Path('docs/generated/ORIGINS_DXR_FOREST_F1_REAL_RENDER.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          '@ | python -

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- maps/origins/forest/forest_f1.map docs/generated/forest-room/real-overview.png docs/generated/forest-room/build-report.json docs/generated/forest-room/render-report.json docs/generated/ORIGINS_DXR_FOREST_F1_REAL_RENDER.md
          if (git diff --cached --quiet) { exit 0 }
          git commit -m 'feat(map): render Forest F1 with real Zircon tiles'
          git pull --rebase origin Origins-DxR
          git push origin HEAD:Origins-DxR

      - name: Upload authentic Forest F1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: origins-dxr-authentic-forest-f1
          path: |
            artifacts/forest-room-real/forest_f1.map
            artifacts/forest-room-real/build-report.json
            artifacts/forest-room-real/render/bichon-cataclysm-real-overview.png
            artifacts/forest-room-real/render/render-report.json
            docs/generated/ORIGINS_DXR_FOREST_F1_REAL_RENDER.md
