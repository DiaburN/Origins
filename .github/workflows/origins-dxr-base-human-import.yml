name: Origins DxR - Import Zircon Base Humans

on:
  push:
    branches: [Origins-DxR]
    paths:
      - 'scripts/fetch-zircon-base-humans.ps1'
      - 'scripts/fetch-zircon-base-humans.py'
      - 'scripts/prepare-zircon-libraryeditor-managed-dxt.py'
      - 'tools/zircon-web-asset-exporter/**'
      - 'apps/origins-web-runtime/player-sprite-runtime.js'
      - 'apps/origins-web-runtime/player-animation-runtime.js'
      - '.github/workflows/origins-dxr-base-human-import.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: origins-dxr-base-human-import-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIRCON_COMMIT: cbf1aa919083bc13fc3f23f93772a8ab8370632d
  CONTRACT_JSON: apps/origins-web-runtime/generated/zircon-player-asset-contract.json
  RAW_ROOT: runtime-assets/zircon
  WEB_ASSET_ROOT: artifacts/base-human-import/web-assets/player

jobs:
  import-base-humans:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Bootstrap pinned Zircon
        id: bootstrap
        continue-on-error: true
        shell: pwsh
        run: |
          ./scripts/bootstrap-zircon.ps1
          $actual = (git -C vendor/zircon rev-parse HEAD).Trim()
          if ($actual -ne $env:ZIRCON_COMMIT) { throw "Pinned Zircon mismatch: $actual" }

      - name: Fetch real M-Hum + WM-Hum
        id: fetch
        if: steps.bootstrap.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/base-human-import | Out-Null
          ./scripts/fetch-zircon-base-humans.ps1 `
            -ZirconRoot vendor/zircon `
            -OutputRoot $env:RAW_ROOT `
            -ReportPath artifacts/base-human-import/fetch.json

      - name: Prepare exporter-only managed DXT decoder
        id: manageddxt
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          python scripts/prepare-zircon-libraryeditor-managed-dxt.py `
            --zircon-root vendor/zircon `
            --report artifacts/base-human-import/managed-dxt.json

      - name: Build ZL atlas exporter
        id: build
        if: steps.manageddxt.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet build tools/zircon-web-asset-exporter/ZirconWebAssetExporter.csproj -c Release -p:Platform=AnyCPU

      - name: Export both genders to browser atlases
        id: export
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:WEB_ASSET_ROOT | Out-Null
          $log = 'artifacts/base-human-import/export.log'
          & dotnet run --project tools/zircon-web-asset-exporter/ZirconWebAssetExporter.csproj `
            -c Release -p:Platform=AnyCPU --no-build -- `
            --contract $env:CONTRACT_JSON `
            --source-root $env:RAW_ROOT `
            --output-root $env:WEB_ASSET_ROOT `
            --base-humans 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) { throw "ZL exporter exited with code $code. See $log" }

      - name: Validate generated pair
        id: validate
        if: steps.export.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          @'
          import json
          from pathlib import Path
          root = Path('artifacts/base-human-import/web-assets/player')
          master = json.loads((root/'player-assets.json').read_text(encoding='utf-8-sig'))
          libs = {r['libraryFile']: r for r in master['libraries']}
          if set(libs) != {'M_Hum','WM_Hum'}:
              raise SystemExit(f'Unexpected libraries: {set(libs)}')
          rows=[]
          for name in ['M_Hum','WM_Hum']:
              mp = root/libs[name]['manifest']
              m = json.loads(mp.read_text(encoding='utf-8-sig'))
              pages=[mp.parent/p for p in m['pages']]
              if m['exportedImageCount'] <= 0 or not pages or any(not p.exists() or p.stat().st_size == 0 for p in pages):
                  raise SystemExit(f'{name}: incomplete atlas')
              rows.append({
                  'libraryFile':name,'imageCount':m['imageCount'],
                  'exportedImageCount':m['exportedImageCount'],'pageCount':len(pages),
                  'atlasBytes':sum(p.stat().st_size for p in pages),
                  'manifestBytes':mp.stat().st_size,'sourceSha256':m['sourceSha256']})
          out={'schema':'origins.zircon.base-human-import-validation.v1','status':'PASS',
               'libraries':rows,'webAssetBytes':sum(p.stat().st_size for p in root.rglob('*') if p.is_file())}
          Path('artifacts/base-human-import/validation.json').write_text(json.dumps(out,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,indent=2))
          '@ | python -

      - name: Build runnable web preview
        id: preview
        if: steps.validate.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $preview='artifacts/base-human-import/preview'
          New-Item -ItemType Directory -Force $preview | Out-Null
          Copy-Item apps/origins-web-runtime/* $preview -Recurse -Force
          $dest=Join-Path $preview 'assets/player'
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item "$env:WEB_ASSET_ROOT/*" $dest -Recurse -Force

      - name: Write evidence
        id: evidence
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force docs/generated | Out-Null
          New-Item -ItemType Directory -Force artifacts/base-human-import | Out-Null
          @'
          import json, os
          from pathlib import Path
          outcomes={
            'Bootstrap pinned Zircon':'${{ steps.bootstrap.outcome }}',
            'Fetch M-Hum + WM-Hum':'${{ steps.fetch.outcome }}',
            'Prepare managed DXT decoder':'${{ steps.manageddxt.outcome }}',
            'Build ZL exporter':'${{ steps.build.outcome }}',
            'Export browser atlases':'${{ steps.export.outcome }}',
            'Validate generated pair':'${{ steps.validate.outcome }}',
            'Build runnable preview':'${{ steps.preview.outcome }}'}
          gate='PASS' if all(v=='success' for v in outcomes.values()) else 'FAIL'
          def load(p):
              p=Path(p); return json.loads(p.read_text(encoding='utf-8-sig')) if p.exists() else {}
          fetch=load('artifacts/base-human-import/fetch.json')
          dxt=load('artifacts/base-human-import/managed-dxt.json')
          val=load('artifacts/base-human-import/validation.json')
          logp=Path('artifacts/base-human-import/export.log')
          lines=['# ORIGINS-DxR — Zircon Base Human Import','',f'- Import gate: **{gate}**',
            f'- Zircon authority: `{os.environ["ZIRCON_COMMIT"]}`',
            f'- Origins-DxR HEAD tested: `{os.environ.get("GITHUB_SHA","unknown")}`',
            f'- Primary patch host from Zircon: `{fetch.get("primaryPatchHost","not reached")}`',
            f'- Fetch status: **{fetch.get("status","NO_REPORT")}**']
          if fetch.get('error'): lines += [f'- Fetch error: `{fetch["error"]}`']
          if dxt:
              lines += [f'- Export decode path: **managed BCnEncoder BC1/BC3**',
                        f'- Exporter patch scope: `{dxt.get("scope","unknown")}`']
          lines += ['','## CI','','| Check | Result |','|---|---|']
          lines += [f'| {k} | {v} |' for k,v in outcomes.items()]
          if fetch.get('libraries'):
              lines += ['','## Downloaded ZL files','']
              for f in fetch['libraries']:
                  lines += [f'- `{f["libraryFile"]}` from `{f["patchUrl"]}` — {f["compressedBytes"]} gzip bytes → {f["bytes"]} raw bytes — SHA-256 `{f["sha256"]}`']
          if dxt:
              lines += ['','## Exporter DXT decode','','- DXT1 is decoded as `BCnEncoder.Net CompressionFormat.Bc1`.',
                        '- DXT5 is decoded as `BCnEncoder.Net CompressionFormat.Bc3`.',
                        '- The patch exists only in the transient pinned `vendor/zircon` checkout used by the exporter; no Zircon runtime source is committed or altered.']
          if outcomes['Export browser atlases'] != 'success' and logp.exists():
              tail=logp.read_text(encoding='utf-8',errors='replace').splitlines()[-80:]
              lines += ['','## Exporter error log','', '```text', *tail, '```']
          if gate=='PASS':
              by={r['libraryFile']:r for r in val['libraries']}
              lines += ['','- Runtime pair: **M_Hum + WM_Hum READY**','','## Browser atlases','']
              for n in ['M_Hum','WM_Hum']:
                  v=by[n]; lines += [f'- `{n}`: {v["exportedImageCount"]}/{v["imageCount"]} images, {v["pageCount"]} atlas pages, {v["atlasBytes"]} PNG bytes']
              lines += ['',f'- Total generated browser payload: **{val["webAssetBytes"]} bytes**',
                        '- Runnable preview artifact includes both real genders.',
                        '- Raw `.Zl` files remain transient build inputs; no Crystal fallback.']
          else:
              lines += ['','## Boundary','', '- No real-import PASS is claimed until download, export and validation all succeed.', '- No Crystal or placeholder art is substituted.']
          Path('docs/generated/ORIGINS_DXR_BASE_HUMAN_IMPORT.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          Path('artifacts/base-human-import/import-gate.txt').write_text(gate+'\n',encoding='utf-8')
          '@ | python -

      - name: Upload runnable preview
        if: steps.preview.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: origins-dxr-base-humans-preview
          path: artifacts/base-human-import/preview/
          if-no-files-found: error

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: origins-dxr-base-human-import-evidence
          path: |
            artifacts/base-human-import/
            docs/generated/ORIGINS_DXR_BASE_HUMAN_IMPORT.md
          if-no-files-found: warn

      - name: Commit evidence report
        if: always()
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/generated/ORIGINS_DXR_BASE_HUMAN_IMPORT.md
          if (-not (git diff --cached --quiet)) {
            git commit -m 'audit(dxr): record real M-Hum and WM-Hum import'
            git pull --rebase origin Origins-DxR
            git push origin HEAD:Origins-DxR
          }

      - name: Enforce real import gate
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path artifacts/base-human-import/import-gate.txt)) { throw 'Missing base-human import gate.' }
          $gate=(Get-Content artifacts/base-human-import/import-gate.txt -Raw).Trim()
          if ($gate -ne 'PASS') { throw "Base-human import gate is $gate" }
