name: Origins DxR - Web Runtime Foundation

on:
  push:
    branches: [Origins-DxR]
    paths:
      - 'apps/origins-web-runtime/index.html'
      - 'apps/origins-web-runtime/main.js'
      - 'apps/origins-web-runtime/runtime-core.js'
      - 'apps/origins-web-runtime/player-animation-runtime.js'
      - 'apps/origins-web-runtime/player-sprite-runtime.js'
      - 'apps/origins-web-runtime/player-visual-runtime.js'
      - 'apps/origins-web-runtime/runtime.css'
      - 'apps/origins-web-runtime/package.json'
      - 'apps/origins-web-runtime/tests/**'
      - 'scripts/audit-origins-web-runtime.py'
      - '.github/workflows/origins-dxr-web-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: origins-dxr-web-runtime-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIRCON_COMMIT: cbf1aa919083bc13fc3f23f93772a8ab8370632d

jobs:
  web-runtime-foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Origins-DxR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bootstrap pinned Zircon
        id: bootstrap
        continue-on-error: true
        run: |
          ./scripts/bootstrap-zircon.sh
          actual="$(git -C vendor/zircon rev-parse HEAD)"
          test "$actual" = "$ZIRCON_COMMIT"

      - name: JavaScript syntax checks
        id: syntax
        continue-on-error: true
        run: |
          node --check apps/origins-web-runtime/runtime-core.js
          node --check apps/origins-web-runtime/player-animation-runtime.js
          node --check apps/origins-web-runtime/player-sprite-runtime.js
          node --check apps/origins-web-runtime/player-visual-runtime.js
          node --check apps/origins-web-runtime/main.js

      - name: Runtime unit tests
        id: tests
        continue-on-error: true
        working-directory: apps/origins-web-runtime
        run: npm test

      - name: Audit web runtime against pinned Zircon
        id: audit
        continue-on-error: true
        run: |
          mkdir -p artifacts/web-runtime
          python scripts/audit-origins-web-runtime.py \
            --enum-source vendor/zircon/LibraryCore/Enum.cs \
            --app-root apps/origins-web-runtime \
            --output artifacts/web-runtime/audit.json

      - name: Static HTTP smoke test
        id: smoke
        continue-on-error: true
        shell: bash
        run: |
          python -m http.server 4173 --directory . > /tmp/origins-web-runtime-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/apps/origins-web-runtime/ > /tmp/index.html; then
              break
            fi
            sleep 0.25
          done
          grep -q 'ORIGINS WEB — Runtime mínimo' /tmp/index.html
          curl --fail --silent http://127.0.0.1:4173/apps/origins-web-runtime/runtime-core.js | grep -q 'MIR_DIRECTION'
          curl --fail --silent http://127.0.0.1:4173/apps/origins-web-runtime/player-visual-runtime.js | grep -q 'resolvePlayerVisualComposition'
          curl --fail --silent http://127.0.0.1:4173/apps/origins-web-runtime/main.js | grep -q 'requestAnimationFrame'

      - name: Write runtime foundation evidence report
        id: report
        if: always()
        shell: bash
        run: |
          mkdir -p docs/generated artifacts/web-runtime
          python - <<'PY'
          import json,os
          from pathlib import Path
          outcomes={
            'Bootstrap pinned Zircon':'${{ steps.bootstrap.outcome }}',
            'JavaScript syntax':'${{ steps.syntax.outcome }}',
            'Runtime unit tests':'${{ steps.tests.outcome }}',
            'Pinned source audit':'${{ steps.audit.outcome }}',
            'Static HTTP smoke':'${{ steps.smoke.outcome }}'}
          gate='PASS' if all(v=='success' for v in outcomes.values()) else 'FAIL'
          ap=Path('artifacts/web-runtime/audit.json')
          audit=json.loads(ap.read_text()) if ap.exists() else {'checks':[]}
          lines=['# ORIGINS-DxR — Web Runtime Foundation','',
            f'- Gate: **{gate}**',
            f'- Origins-DxR HEAD tested: `{os.environ.get("GITHUB_SHA","unknown")}`',
            f'- Zircon authority: `{os.environ["ZIRCON_COMMIT"]}`',
            '- Runtime mode: `PREVIEW_LOCAL` (server-authoritative transport is a later vertical-slice step).','',
            '## CI','','| Check | Result |','|---|---|']
          lines += [f'| {k} | {v} |' for k,v in outcomes.items()]
          lines += ['','## Runtime contract','',
            '- Dedicated runtime: `apps/origins-web-runtime/`; the closed Zircon UI reference remains separate.',
            '- Fixed 60 Hz simulation with keyboard and touch movement.',
            '- `MirDirection` and `MirAction` remain audited against pinned Zircon.',
            '- Real M-Hum/WM-Hum atlases are consumed through the sprite store when present.',
            '- Player visual composition now resolves native body/hair/helmet/weapon1/weapon2/shield/horse libraries, frame indices and direction-dependent draw order.',
            '- Normal W/W/T body banks use the Zircon +5000 stride; Assassin bodies use +3000 and animation-specific `ArmourShift` values, including Fishing +80.',
            '- Browser does not open `System.db`/`Users.db` and no Crystal runtime fallback exists.',
            '', '## Source audit checks','', '| Check | Result | Details |','|---|---|---|']
          for item in audit.get('checks',[]):
              detail=str(item.get('details','')).replace('|','\\|')
              lines.append(f'| {item.get("name","unknown")} | {"PASS" if item.get("pass") else "FAIL"} | {detail} |')
          lines += ['','## Boundary','',
            '- This PASS validates the browser runtime and visual-composition contracts. It does not claim server-authoritative movement, a real map, combat, or login.',
            '- Asset availability is audited separately; a correct requested frame can still be an upstream empty slot.']
          Path('docs/generated/ORIGINS_DXR_WEB_RUNTIME_STEP1.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          Path('artifacts/web-runtime/gate.txt').write_text(gate+'\n',encoding='utf-8')
          PY

      - name: Commit non-stale evidence report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/generated/ORIGINS_DXR_WEB_RUNTIME_STEP1.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit(dxr): record web runtime foundation'
          git fetch origin Origins-DxR
          remote="$(git rev-parse origin/Origins-DxR)"
          if [[ "$remote" != "$GITHUB_SHA" ]]; then
            meaningful="$(git diff --name-only "$GITHUB_SHA" "$remote" | grep -v '^docs/generated/' || true)"
            if [[ -n "$meaningful" ]]; then echo "Skipping stale runtime evidence: $meaningful"; exit 0; fi
          fi
          git pull --rebase origin Origins-DxR
          git push origin HEAD:Origins-DxR

      - name: Enforce runtime gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f artifacts/web-runtime/gate.txt
          [[ "$(tr -d '\r\n' < artifacts/web-runtime/gate.txt)" == 'PASS' ]]
