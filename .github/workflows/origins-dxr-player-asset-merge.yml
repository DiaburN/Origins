name: Origins DxR - Player Asset Bundle Merge

on:
  push:
    branches: [Origins-DxR]
    paths:
      - 'scripts/merge-zircon-web-player-assets.py'
      - 'scripts/tests/test_merge_zircon_web_player_assets.py'
      - '.github/workflows/origins-dxr-player-asset-merge.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: origins-dxr-player-asset-merge-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIRCON_COMMIT: cbf1aa919083bc13fc3f23f93772a8ab8370632d

jobs:
  merge-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python syntax
        id: syntax
        continue-on-error: true
        run: python -m py_compile scripts/merge-zircon-web-player-assets.py scripts/tests/test_merge_zircon_web_player_assets.py

      - name: Merge unit tests
        id: tests
        continue-on-error: true
        run: python -m unittest -v scripts/tests/test_merge_zircon_web_player_assets.py

      - name: Write evidence
        if: always()
        shell: bash
        env:
          SYNTAX_OUTCOME: ${{ steps.syntax.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          set -euo pipefail
          mkdir -p docs/generated artifacts/player-asset-merge
          python - <<'PY'
          import os
          from pathlib import Path
          outcomes={'Python syntax':os.environ.get('SYNTAX_OUTCOME','unknown'),'5 merger unit tests':os.environ.get('TEST_OUTCOME','unknown')}
          gate='PASS' if all(v=='success' for v in outcomes.values()) else 'FAIL'
          lines=['# ORIGINS-DxR — Player Asset Bundle Merger','',f'- Gate: **{gate}**',f'- Zircon authority: `{os.environ["ZIRCON_COMMIT"]}`',f'- HEAD tested: `{os.environ.get("GITHUB_SHA","unknown")}`','', '## CI','','| Check | Result |','|---|---|']+[f'| {k} | {v} |' for k,v in outcomes.items()]
          lines += ['','## Merge contract','',
            '- Every input master and library manifest must use `origins.zircon.web-atlas.v1`.',
            '- All bundles must target the same pinned Zircon commit and atlas size.',
            '- Library paths are constrained to their input bundle roots.',
            '- Duplicate libraries are accepted only when manifest + every referenced atlas PNG hash identically.',
            '- Conflicting duplicates fail closed.',
            '- Atlas PNGs and frame metadata are copied byte-for-byte; the merger only rebuilds the top-level `player-assets.json`.']
          Path('docs/generated/ORIGINS_DXR_PLAYER_ASSET_MERGE.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          Path('artifacts/player-asset-merge/gate.txt').write_text(gate+'\n',encoding='utf-8')
          PY

      - name: Commit non-stale evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/generated/ORIGINS_DXR_PLAYER_ASSET_MERGE.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'audit(dxr): record player asset bundle merger'
          git fetch origin Origins-DxR
          remote="$(git rev-parse origin/Origins-DxR)"
          if [[ "$remote" != "$GITHUB_SHA" ]]; then
            meaningful="$(git diff --name-only "$GITHUB_SHA" "$remote" | grep -v '^docs/generated/' || true)"
            if [[ -n "$meaningful" ]]; then echo "Skipping stale merger evidence push: $meaningful"; exit 0; fi
          fi
          git pull --rebase origin Origins-DxR
          git push origin HEAD:Origins-DxR

      - name: Enforce gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(tr -d '\r\n' < artifacts/player-asset-merge/gate.txt)" == 'PASS' ]]
