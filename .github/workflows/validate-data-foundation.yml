name: Validate ORIGINS data foundation

on:
  workflow_dispatch:
  push:
    branches: [feature/origins-data-foundation-v1]
    paths:
      - ".github/workflows/validate-data-foundation.yml"
      - "packages/database/**"
      - "tools/data-foundation/**"
  pull_request:
    paths:
      - ".github/workflows/validate-data-foundation.yml"
      - "packages/database/**"
      - "tools/data-foundation/**"

permissions:
  contents: read

jobs:
  postgres-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: origins
          POSTGRES_DB: origins
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d origins"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: origins
      PGDATABASE: origins
      CRYSTAL_SHA: 0e315fe327192afe52c3d7357ddd1f5b7e26c5b8
      MONK_SHA: 381e589e3d7ee736cdf0583c8315c0d144ab058f

    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client

      - name: Checkout pinned Crystal sources
        run: |
          set -euo pipefail
          git clone https://github.com/Suprcode/Crystal.git .source/Crystal
          git -C .source/Crystal checkout "$CRYSTAL_SHA"
          git clone https://github.com/JevLOMCN/Crystal-Monk.git .source/Crystal-Monk
          git -C .source/Crystal-Monk checkout "$MONK_SHA"
          test "$(git -C .source/Crystal rev-parse HEAD)" = "$CRYSTAL_SHA"
          test "$(git -C .source/Crystal-Monk rev-parse HEAD)" = "$MONK_SHA"

      - name: Build canonical 114-spell catalog
        run: |
          set -euo pipefail
          mkdir -p .build/data-foundation
          python3 tools/data-foundation/build_crystal_magic_catalog.py \
            --crystal-enums .source/Crystal/Shared/Enums.cs \
            --crystal-envir .source/Crystal/Server/MirEnvir/Envir.cs \
            --monk-common .source/Crystal-Monk/Common.cs \
            --monk-envir .source/Crystal-Monk/Server/MirEnvir/Envir.cs \
            --crystal-sha "$CRYSTAL_SHA" \
            --monk-sha "$MONK_SHA" \
            --out .build/data-foundation/magic-catalog.json
          python3 tools/data-foundation/magic_catalog_to_sql.py \
            --catalog .build/data-foundation/magic-catalog.json \
            --out .build/data-foundation/magics.sql

      - name: Apply database foundation
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f packages/database/migrations/0001_core.sql
          psql -v ON_ERROR_STOP=1 -f packages/database/migrations/0002_zircon_crystal_extensions.sql
          psql -v ON_ERROR_STOP=1 -f packages/database/seeds/0001_classes.sql
          psql -v ON_ERROR_STOP=1 -f packages/database/migrations/0003_item_class_overlays.sql
          psql -v ON_ERROR_STOP=1 -f .build/data-foundation/magics.sql
          psql -v ON_ERROR_STOP=1 -f packages/database/migrations/0004_item_equip_class_rules.sql
          psql -v ON_ERROR_STOP=1 -f packages/database/migrations/0005_world_content_and_progression.sql
          psql -v ON_ERROR_STOP=1 -f packages/database/migrations/0006_class_combat_and_equipment_contract.sql

      - name: Validate spell source contract
        run: |
          set -euo pipefail
          test "$(psql -Atqc "SELECT count(*) FROM content.class_definitions")" = "6"
          test "$(psql -Atqc "SELECT count(*) FROM content.magic_definitions")" = "114"
          test "$(psql -Atqc "SELECT count(*) FROM content.magic_definitions WHERE source_implemented")" = "113"
          test "$(psql -Atqc "SELECT count(*) FROM content.magic_definitions WHERE game_key='wizard.fastmove' AND source_implemented=false AND icon_index IS NULL")" = "1"
          test "$(psql -Atqc "SELECT concat_ws(',',icon_index,need_level_1,need_level_2,need_level_3) FROM content.magic_definitions WHERE game_key='taoist.healingcircle'")" = "82,39,41,43"
          test "$(psql -Atqc "SELECT concat_ws(',',icon_index,need_level_1,need_level_2,need_level_3,experience_3) FROM content.magic_definitions WHERE game_key='archer.stonetrap'")" = "97,40,43,46,141"

      - name: Validate class combat stat contract
        run: |
          set -euo pipefail
          test "$(psql -Atqc "SELECT primary_offense_stat FROM content.class_combat_profiles WHERE class_id=1")" = "DC"
          test "$(psql -Atqc "SELECT primary_offense_stat FROM content.class_combat_profiles WHERE class_id=2")" = "MC"
          test "$(psql -Atqc "SELECT primary_offense_stat FROM content.class_combat_profiles WHERE class_id=3")" = "SC"
          test "$(psql -Atqc "SELECT primary_offense_stat FROM content.class_combat_profiles WHERE class_id=4")" = "DC"
          test "$(psql -Atqc "SELECT concat_ws('+',primary_offense_stat,secondary_offense_stat) FROM content.class_combat_profiles WHERE class_id=5")" = "DC+MC"
          test "$(psql -Atqc "SELECT concat_ws('+',primary_offense_stat,secondary_offense_stat) FROM content.class_combat_profiles WHERE class_id=6")" = "DC+SC"

      - name: Validate hybrid item stats and class equip rules
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO content.item_definitions
            (game_key,item_name,item_type,source_system,source_repo,source_path,class_restriction_mode)
          VALUES
            ('qa.archerbow','QA Archer Bow','Weapon','zircon','Suprcode/Zircon','QA','restricted');

          INSERT INTO content.item_stats (item_definition_id,stat_code,amount)
          SELECT id,'DC',10 FROM content.item_definitions WHERE game_key='qa.archerbow';

          INSERT INTO content.item_class_stats
            (item_definition_id,class_id,stat_code,amount,mode,source_system,source_repo,source_path)
          SELECT id,5,'DC',17,'replace','crystal','Suprcode/Crystal.Database','Jev/Server.MirDB'
          FROM content.item_definitions WHERE game_key='qa.archerbow';

          INSERT INTO content.item_allowed_classes (item_definition_id,class_id,source_system)
          SELECT id,5,'crystal' FROM content.item_definitions WHERE game_key='qa.archerbow';

          INSERT INTO content.item_equip_slots (item_definition_id,slot_code)
          SELECT id,'weapon' FROM content.item_definitions WHERE game_key='qa.archerbow';

          DO $$
          DECLARE
            item_id bigint;
            warrior_dc numeric;
            archer_dc numeric;
          BEGIN
            SELECT id INTO item_id FROM content.item_definitions WHERE game_key='qa.archerbow';
            SELECT amount INTO warrior_dc FROM content.effective_item_stats WHERE item_definition_id=item_id AND class_code='warrior' AND stat_code='DC';
            SELECT amount INTO archer_dc FROM content.effective_item_stats WHERE item_definition_id=item_id AND class_code='archer' AND stat_code='DC';
            IF warrior_dc <> 10 THEN RAISE EXCEPTION 'Zircon base stat inheritance failed'; END IF;
            IF archer_dc <> 17 THEN RAISE EXCEPTION 'Crystal Archer stat overlay failed'; END IF;
            IF content.can_class_equip_item(item_id, 1) THEN RAISE EXCEPTION 'Warrior equipped Archer-only item'; END IF;
            IF NOT content.can_class_equip_item(item_id, 5) THEN RAISE EXCEPTION 'Archer rejected Archer-only item'; END IF;
            IF NOT content.can_class_equip_item_in_slot(item_id,5,'weapon') THEN RAISE EXCEPTION 'Archer weapon slot rejected'; END IF;
            IF content.can_class_equip_item_in_slot(item_id,5,'armour') THEN RAISE EXCEPTION 'Archer bow accepted in armour slot'; END IF;
          END $$;
          SQL

      - name: Validate Zircon-style player magic lifecycle
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO player.accounts (account_name) VALUES ('qa_account');
          INSERT INTO player.characters (account_id, character_name, class_id, current_hp, current_mp)
          SELECT id, 'qa_wizard', 2, 100, 100 FROM player.accounts WHERE account_name='qa_account';
          DO $$
          DECLARE c uuid; m bigint;
          BEGIN
            SELECT id INTO c FROM player.characters WHERE character_name='qa_wizard';
            SELECT id INTO m FROM content.magic_definitions WHERE game_key='wizard.fireball';
            IF EXISTS (SELECT 1 FROM player.character_magics WHERE character_id=c AND magic_definition_id=m) THEN
              RAISE EXCEPTION 'Unlearned magic must have no UserMagic row';
            END IF;
            INSERT INTO player.character_magics (character_id, magic_definition_id, level, experience) VALUES (c,m,1,250);
            IF NOT EXISTS (SELECT 1 FROM player.character_magics WHERE character_id=c AND magic_definition_id=m AND level=1 AND experience=250) THEN
              RAISE EXCEPTION 'UserMagic lifecycle failed';
            END IF;
          END $$;
          SQL

      - name: Validate foundation tables
        run: |
          python3 - <<'PY'
          import subprocess
          expected = {
            'content': {
              'class_definitions','class_combat_profiles','equipment_slot_definitions','map_definitions','map_regions','map_connections',
              'magic_definitions','item_definitions','item_stats','item_source_links','item_class_profiles','item_class_stats','item_source_policy',
              'item_allowed_classes','item_equip_slots','monster_definitions','monster_stats','monster_drops','monster_respawns','monster_magics',
              'buff_definitions','quest_definitions','quest_tasks','quest_rewards','currency_definitions','npc_definitions','npc_shop_goods',
              'dungeon_definitions','dungeon_maps','summon_definitions'
            },
            'player': {
              'accounts','characters','character_stats','character_magics','item_instances','character_item_slots','character_buffs','character_quests',
              'character_currencies','character_pets'
            },
            'gameplay': {'dungeon_runs','combat_sessions','combat_events','monster_kills'},
          }
          for schema, required in expected.items():
            actual=set(subprocess.check_output(['psql','-Atqc',f"SELECT tablename FROM pg_tables WHERE schemaname='{schema}'"]).decode().splitlines())
            missing=required-actual
            if missing: raise SystemExit(f'{schema}: missing {sorted(missing)}')
            print(schema, len(actual), 'tables PASS')
          PY
