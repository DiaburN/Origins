name: Origins DxR - Starter Player Visual Import

on:
  push:
    branches: [Origins-DxR]
    paths:
      - 'scripts/fetch-zircon-player-libraries.py'
      - 'scripts/prepare-zircon-libraryeditor-managed-dxt.py'
      - 'tools/zircon-web-asset-exporter/**'
      - 'apps/origins-web-runtime/player-visual-runtime.js'
      - 'apps/origins-web-runtime/player-animation-runtime.js'
      - 'apps/origins-web-runtime/generated/zircon-player-asset-contract.json'
      - '.github/workflows/origins-dxr-starter-player-visual-import.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: origins-dxr-starter-player-visual-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIRCON_COMMIT: cbf1aa919083bc13fc3f23f93772a8ab8370632d
  CONTRACT_JSON: apps/origins-web-runtime/generated/zircon-player-asset-contract.json
  RAW_ROOT: runtime-assets/zircon-starter-player
  WEB_ROOT: artifacts/starter-player-visual/web-assets/player

jobs:
  starter-player-visual:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Bootstrap pinned Zircon
        id: bootstrap
        continue-on-error: true
        shell: pwsh
        run: |
          ./scripts/bootstrap-zircon.ps1
          $actual=(git -C vendor/zircon rev-parse HEAD).Trim()
          if ($actual -ne $env:ZIRCON_COMMIT) { throw "Pinned Zircon mismatch: $actual" }

      - name: Prepare managed DXT decoder for exporter only
        id: manageddxt
        if: steps.bootstrap.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/starter-player-visual | Out-Null
          python scripts/prepare-zircon-libraryeditor-managed-dxt.py `
            --zircon-root vendor/zircon `
            --report artifacts/starter-player-visual/managed-dxt.json

      - name: Fetch official starter player libraries
        id: fetch
        if: steps.manageddxt.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $libs=@(
            'M_Hum','WM_Hum',
            'M_Hair','WM_Hair',
            'M_Weapon1','WM_Weapon1',
            'M_Helmet1','WM_Helmet1',
            'M_Shield1','WM_Shield1'
          )
          $args=@(
            '--zircon-root','vendor/zircon',
            '--contract',$env:CONTRACT_JSON,
            '--output-root',$env:RAW_ROOT,
            '--report','artifacts/starter-player-visual/fetch.json',
            '--workers','6'
          )
          foreach($lib in $libs){ $args += @('--library',$lib) }
          python scripts/fetch-zircon-player-libraries.py @args
          if ($LASTEXITCODE -ne 0) { throw "Starter player library fetch failed with $LASTEXITCODE" }

      - name: Build web atlas exporter
        id: build
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet build tools/zircon-web-asset-exporter/ZirconWebAssetExporter.csproj -c Release -p:Platform=AnyCPU

      - name: Export starter player atlases
        id: export
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:WEB_ROOT | Out-Null
          $libs=@(
            'M_Hum','WM_Hum',
            'M_Hair','WM_Hair',
            'M_Weapon1','WM_Weapon1',
            'M_Helmet1','WM_Helmet1',
            'M_Shield1','WM_Shield1'
          )
          $args=@(
            '--contract',$env:CONTRACT_JSON,
            '--source-root',$env:RAW_ROOT,
            '--output-root',$env:WEB_ROOT
          )
          foreach($lib in $libs){ $args += @('--library',$lib) }
          & dotnet run --project tools/zircon-web-asset-exporter/ZirconWebAssetExporter.csproj `
            -c Release -p:Platform=AnyCPU --no-build -- @args
          if ($LASTEXITCODE -ne 0) { throw "Starter atlas exporter failed with $LASTEXITCODE" }

      - name: Validate exact visual stack
        id: validate
        if: steps.export.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          @'
          import json
          from pathlib import Path
          expected={
            'M_Hum','WM_Hum','M_Hair','WM_Hair','M_Weapon1','WM_Weapon1',
            'M_Helmet1','WM_Helmet1','M_Shield1','WM_Shield1'
          }
          root=Path('artifacts/starter-player-visual/web-assets/player')
          master=json.loads((root/'player-assets.json').read_text(encoding='utf-8-sig'))
          rows={r['libraryFile']:r for r in master.get('libraries',[])}
          if set(rows)!=expected:
              raise SystemExit(f'Starter manifest mismatch: got={sorted(rows)}, expected={sorted(expected)}')
          summary=[]
          for name in sorted(expected):
              manifest_path=root/rows[name]['manifest']
              manifest=json.loads(manifest_path.read_text(encoding='utf-8-sig'))
              pages=[manifest_path.parent/p for p in manifest.get('pages',[])]
              if manifest.get('exportedImageCount',0)<=0:
                  raise SystemExit(f'{name}: zero exported images')
              if not pages or any(not p.is_file() or p.stat().st_size<=0 for p in pages):
                  raise SystemExit(f'{name}: incomplete atlas pages')
              summary.append({
                'libraryFile':name,
                'imageCount':manifest['imageCount'],
                'exportedImageCount':manifest['exportedImageCount'],
                'pageCount':len(pages),
                'atlasBytes':sum(p.stat().st_size for p in pages),
                'sourceSha256':manifest['sourceSha256'],
              })
          result={
            'schema':'origins.zircon.starter-player-visual-import.v1',
            'status':'PASS',
            'zirconCommit':master.get('zirconCommit'),
            'libraryCount':len(summary),
            'libraries':summary,
            'webAssetBytes':sum(p.stat().st_size for p in root.rglob('*') if p.is_file()),
          }
          Path('artifacts/starter-player-visual/validation.json').write_text(json.dumps(result,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result,indent=2))
          '@ | python -

      - name: Build runnable equipped preview artifact
        id: preview
        if: steps.validate.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $preview='artifacts/starter-player-visual/preview'
          New-Item -ItemType Directory -Force $preview | Out-Null
          Copy-Item apps/origins-web-runtime/* $preview -Recurse -Force
          $dest=Join-Path $preview 'assets/player'
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item "$env:WEB_ROOT/*" $dest -Recurse -Force

      - name: Write evidence
        id: evidence
        if: always()
        shell: pwsh
        env:
          BOOTSTRAP_OUTCOME: ${{ steps.bootstrap.outcome }}
          DXT_OUTCOME: ${{ steps.manageddxt.outcome }}
          FETCH_OUTCOME: ${{ steps.fetch.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          EXPORT_OUTCOME: ${{ steps.export.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          PREVIEW_OUTCOME: ${{ steps.preview.outcome }}
        run: |
          New-Item -ItemType Directory -Force docs/generated artifacts/starter-player-visual | Out-Null
          @'
          import json,os
          from pathlib import Path
          def load(path):
              p=Path(path)
              return json.loads(p.read_text(encoding='utf-8-sig')) if p.exists() else {}
          outcomes={
            'Bootstrap pinned Zircon':os.environ.get('BOOTSTRAP_OUTCOME','unknown'),
            'Prepare managed DXT decoder':os.environ.get('DXT_OUTCOME','unknown'),
            'Fetch 10 official player libraries':os.environ.get('FETCH_OUTCOME','unknown'),
            'Build atlas exporter':os.environ.get('BUILD_OUTCOME','unknown'),
            'Export browser atlases':os.environ.get('EXPORT_OUTCOME','unknown'),
            'Validate exact visual stack':os.environ.get('VALIDATE_OUTCOME','unknown'),
            'Build runnable preview':os.environ.get('PREVIEW_OUTCOME','unknown'),
          }
          validation=load('artifacts/starter-player-visual/validation.json')
          gate='PASS' if all(v=='success' for v in outcomes.values()) and validation.get('status')=='PASS' else 'FAIL'
          lines=[
            '# ORIGINS-DxR — Starter Player Visual Import','',
            f'- Gate: **{gate}**',
            f'- Zircon authority: `{os.environ["ZIRCON_COMMIT"]}`',
            f'- Origins-DxR HEAD tested: `{os.environ.get("GITHUB_SHA","unknown")}`','',
            '## CI','','| Check | Result |','|---|---|',
          ]
          lines += [f'| {k} | {v} |' for k,v in outcomes.items()]
          lines += ['','## Imported visual stack','']
          if validation.get('libraries'):
              lines += ['| Library | Exported / slots | Atlas pages | PNG bytes |','|---|---:|---:|---:|']
              for row in validation['libraries']:
                  lines.append(f'| {row["libraryFile"]} | {row["exportedImageCount"]} / {row["imageCount"]} | {row["pageCount"]} | {row["atlasBytes"]} |')
              lines += ['',f'- Total generated browser payload: **{validation.get("webAssetBytes",0)} bytes**']
          lines += ['','## Boundary','',
            '- These are official pinned-Zircon player visual libraries only.',
            '- This gate proves fetch/export/integrity of body, hair, weapon, helmet and shield for both genders.',
            '- It does not yet claim that Chrome has drawn every layer together; browser composition proof is a separate gate.',
            '- No Crystal, generated placeholder or cross-gender art can satisfy this gate.']
          Path('docs/generated/ORIGINS_DXR_STARTER_PLAYER_VISUAL_IMPORT.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          Path('artifacts/starter-player-visual/gate.txt').write_text(gate+'\n',encoding='utf-8')
          '@ | python -

      - name: Upload runnable equipped preview
        if: steps.preview.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: origins-dxr-starter-player-visual-preview
          path: artifacts/starter-player-visual/preview/
          if-no-files-found: error

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: origins-dxr-starter-player-visual-evidence
          path: |
            artifacts/starter-player-visual/*.json
            artifacts/starter-player-visual/gate.txt
            docs/generated/ORIGINS_DXR_STARTER_PLAYER_VISUAL_IMPORT.md
          if-no-files-found: warn

      - name: Commit non-stale evidence report
        if: always()
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/generated/ORIGINS_DXR_STARTER_PLAYER_VISUAL_IMPORT.md
          if (git diff --cached --quiet) { exit 0 }
          git commit -m 'audit(dxr): record starter player visual import'
          git fetch origin Origins-DxR
          $remote=(git rev-parse origin/Origins-DxR).Trim()
          if ($remote -ne $env:GITHUB_SHA) {
            $changed=@(git diff --name-only $env:GITHUB_SHA $remote)
            $meaningful=@($changed | Where-Object { $_ -notlike 'docs/generated/*' })
            if ($meaningful.Count -gt 0) {
              Write-Host "Skipping stale evidence push; newer functional changes exist: $($meaningful -join ', ')"
              exit 0
            }
          }
          git pull --rebase origin Origins-DxR
          git push origin HEAD:Origins-DxR

      - name: Enforce starter visual gate
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path artifacts/starter-player-visual/gate.txt)) { throw 'Missing starter player visual gate.' }
          $gate=(Get-Content artifacts/starter-player-visual/gate.txt -Raw).Trim()
          if ($gate -ne 'PASS') { throw "Starter player visual gate is $gate" }
