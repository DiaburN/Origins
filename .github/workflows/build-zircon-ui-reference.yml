name: Build complete Zircon UI reference

on:
  workflow_dispatch:
  push:
    branches: [origins-game-v1]
    paths:
      - ".github/workflows/build-zircon-ui-reference.yml"
      - "tools/zircon-ui-importer/**"
      - "apps/zircon-ui-reference/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout ORIGINS
        uses: actions/checkout@v4

      - name: Install Pillow
        run: python3 -m pip install --user Pillow

      - name: Checkout matching Zircon source specification
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .source/Zircon
          git clone --depth 1 https://github.com/Suprcode/Zircon.git .source/Zircon
          git -C .source/Zircon rev-parse HEAD

      - name: Build complete GameScene UI source manifest
        run: |
          rm -rf .build/zircon-ui
          mkdir -p .build/zircon-ui .source/zircon-ui-libraries
          python3 tools/zircon-ui-importer/build_ui_source_spec.py \
            --zircon-root .source/Zircon \
            --out .build/zircon-ui/ui-source-spec.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('.build/zircon-ui/ui-source-spec.json')
          d=json.loads(p.read_text())
          print('GameScene entries:', d['windowCount'])
          missing=[w for w in d['windows'] if w.get('sourceMissing')]
          print('Missing source classes:', [w['class'] for w in missing])
          if d['windowCount'] < 60:
              raise SystemExit('GameScene UI inventory unexpectedly incomplete')
          character=next(w for w in d['windows'] if w['field']=='CharacterBox')
          expression=character.get('root',{}).get('Index','')
          print('Character root index expression:', expression)
          if '115' not in expression or '110' not in expression:
              raise SystemExit('Root parser lost CharacterDialog conditional index')
          main=next(w for w in d['windows'] if w['field']=='MainPanel')
          char_button=next(c for c in main['controls'] if c['name']=='CharacterButton')
          if char_button['properties'].get('Location') != 'new Point(650, 23)':
              raise SystemExit('MainPanel CharacterButton geometry was not preserved exactly')
          truncated=[]
          for w in d['windows']:
              for c in w.get('controls',[]):
                  for k,v in c.get('properties',{}).items():
                      s=str(v)
                      if ('new Point(' in s or 'new Size(' in s) and ')' not in s:
                          truncated.append((w['field'],c['name'],k,s))
          print('Truncated Point/Size expressions:', len(truncated))
          if truncated:
              print(truncated[:20])
              raise SystemExit('Geometry parser emitted truncated Point/Size expressions')
          PY

      - name: Resolve Zircon English UI labels
        run: |
          python3 tools/zircon-ui-importer/augment_ui_language.py \
            --spec .build/zircon-ui/ui-source-spec.json \
            --english-messages .source/Zircon/Client/Envir/Translations/EnglishMessages.cs
          python3 - <<'PY'
          import json
          from pathlib import Path
          spec=json.loads(Path('.build/zircon-ui/ui-source-spec.json').read_text())
          language=spec.get('language',{})
          print('English messages:', language.get('messageCount'))
          print('Controls with resolved text:', language.get('resolvedControlCount'))
          print('Unresolved referenced keys:', len(language.get('unresolvedReferencedKeys',[])))
          if language.get('messageCount',0) < 300:
              raise SystemExit('EnglishMessages extraction unexpectedly incomplete')
          if language.get('resolvedControlCount',0) < 50:
              raise SystemExit('Too few UI controls received resolved English text')
          PY

      - name: Resolve deterministic Zircon geometry symbols
        run: |
          python3 tools/zircon-ui-importer/augment_ui_symbols.py \
            --spec .build/zircon-ui/ui-source-spec.json \
            --zircon-root .source/Zircon
          python3 - <<'PY'
          import json
          from pathlib import Path
          spec=json.loads(Path('.build/zircon-ui/ui-source-spec.json').read_text())
          info=spec.get('geometrySymbols',{})
          print('Windows changed by symbols:', info.get('windowsChanged'))
          print('Geometry properties simplified:', info.get('propertiesSimplified'))
          if info.get('propertiesSimplified',0) < 5:
              raise SystemExit('Deterministic geometry symbol pass resolved unexpectedly few properties')
          fishing=next(w for w in spec['windows'] if w['field']=='FishingCatchBox')
          throw_pointer=next(c for c in fishing['controls'] if c['name']=='ThrowDistancePointer')
          print('Fishing ThrowDistancePointer:', throw_pointer['properties'].get('Location'))
          if 'PointerXStart' in str(throw_pointer['properties'].get('Location')):
              raise SystemExit('Fishing class constants were not substituted')
          PY

      - name: Validate discovered control type coverage
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          spec=json.loads(Path('.build/zircon-ui/ui-source-spec.json').read_text())
          policy=json.loads(Path('apps/zircon-ui-reference/control-render-policy.json').read_text())
          discovered=sorted({c['type'] for w in spec['windows'] for c in w.get('controls',[])})
          covered=sorted(policy['policies'])
          missing=sorted(set(discovered)-set(covered))
          stale=sorted(set(covered)-set(discovered))
          print('Discovered DX control types:', len(discovered), discovered)
          print('Explicit render policies:', len(covered))
          print('Unmapped control types:', missing)
          print('Policy entries not currently discovered:', stale)
          if missing:
              raise SystemExit('A Zircon DX control type has no explicit render policy')
          PY

      - name: Download and extract exact referenced Zircon UI artwork
        run: |
          python3 tools/zircon-ui-importer/build_full_reference_assets.py \
            --spec .build/zircon-ui/ui-source-spec.json \
            --source-dir .source/zircon-ui-libraries \
            --out .build/zircon-ui

      - name: Assemble complete navigable reference
        run: |
          cp apps/zircon-ui-reference/index.html .build/zircon-ui/index.html
          cp apps/zircon-ui-reference/styles.css .build/zircon-ui/styles.css
          cp apps/zircon-ui-reference/app.js .build/zircon-ui/app.js
          cp apps/zircon-ui-reference/app-layout.js .build/zircon-ui/app-layout.js
          cp apps/zircon-ui-reference/layout-resolver.js .build/zircon-ui/layout-resolver.js
          cp apps/zircon-ui-reference/game-scene-windows.js .build/zircon-ui/game-scene-windows.js
          cp apps/zircon-ui-reference/control-render-policy.json .build/zircon-ui/control-render-policy.json
          node --check .build/zircon-ui/app.js
          node --check .build/zircon-ui/app-layout.js
          node --check .build/zircon-ui/layout-resolver.js
          node --check .build/zircon-ui/game-scene-windows.js
          node tools/zircon-ui-importer/validate_layout_resolver.mjs \
            .build/zircon-ui/ui-source-spec.json \
            .build/zircon-ui/layout-resolver.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          spec=json.loads(Path('.build/zircon-ui/ui-source-spec.json').read_text())
          sizes=spec.get('assetSizes',{})
          if not sizes:
              raise SystemExit('assetSizes missing from built UI source spec')
          for lib,index in [('Interface','16'),('GameInter','82')]:
              size=sizes.get(lib,{}).get(index)
              print('asset size',lib,index,size)
              if not size or size[0] <= 0 or size[1] <= 0:
                  raise SystemExit(f'missing embedded asset size for {lib} {index}')
          PY
          test -s .build/zircon-ui/ui-source-spec.json
          test -s .build/zircon-ui/assets/GameInter/00050.png
          test -s .build/zircon-ui/assets/GameInter/00161.png
          test -s .build/zircon-ui/assets/GameInter/00162.png
          test -s .build/zircon-ui/assets/GameInter/00795.png
          test -s .build/zircon-ui/assets/GameInter/01010.png
          test -s .build/zircon-ui/assets/GameInter/01011.png
          test -s .build/zircon-ui/assets/GameInter/04740.png
          test -s .build/zircon-ui/assets/GameInter/04741.png
          test -s .build/zircon-ui/assets/GameInter/04742.png
          test -s .build/zircon-ui/assets/GameInter/04743.png
          test -s .build/zircon-ui/assets/GameInter/04745.png
          test -s .build/zircon-ui/assets/GameInter/04746.png
          test -s .build/zircon-ui/assets/Interface/00016.png
          test -s .build/zircon-ui/assets/Interface/00041.png
          test -s .build/zircon-ui/assets/Interface/00044.png
          test -s .build/zircon-ui/assets/Interface/00053.png
          test -s .build/zircon-ui/assets/Interface/00056.png
          test -s .build/zircon-ui/assets/Interface/00059.png
          test -s .build/zircon-ui/assets/Interface/00060.png
          test -s .build/zircon-ui/assets/Interface/00061.png
          test -s .build/zircon-ui/assets/Interface/00062.png
          test -s .build/zircon-ui/assets/Interface/00110.png
          test -s .build/zircon-ui/assets/Interface/00130.png
          test -s .build/zircon-ui/assets/Interface/00241.png
          test -s .build/zircon-ui/assets/Interface/00291.png

      - name: Report reconstruction coverage
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          root=Path('.build/zircon-ui')
          spec=json.loads((root/'ui-source-spec.json').read_text())
          assets=json.loads((root/'asset-build.json').read_text())
          policy=json.loads((root/'control-render-policy.json').read_text())
          exact=sum(1 for w in spec['windows'] if w.get('sourcePath'))
          missing=[k for k,v in assets.items() if v.get('missing')]
          discovered={c['type'] for w in spec['windows'] for c in w.get('controls',[])}
          covered=set(policy['policies'])
          controls=sum(len(w.get('controls',[])) for w in spec['windows'])
          locations=location_literal=sizes=size_literal=0
          for w in spec['windows']:
              for c in w.get('controls',[]):
                  p=c.get('properties',{})
                  if 'Location' in p:
                      locations+=1
                      if re.fullmatch(r'new Point\(\s*-?\d+\s*,\s*-?\d+\s*\)',str(p['Location'])):
                          location_literal+=1
                  if 'Size' in p:
                      sizes+=1
                      if re.fullmatch(r'new Size\(\s*-?\d+\s*,\s*-?\d+\s*\)',str(p['Size'])):
                          size_literal+=1
          language=spec.get('language',{})
          symbols=spec.get('geometrySymbols',{})
          print(f"Source-resolved windows: {exact}/{spec['windowCount']}")
          print(f"Control type render coverage: {len(discovered & covered)}/{len(discovered)}")
          print('Parsed controls:',controls)
          print(f'Literal source locations: {location_literal}/{locations}')
          print(f'Literal source sizes: {size_literal}/{sizes}')
          print('Resolved English control labels:',language.get('resolvedControlCount',0))
          print('Deterministic geometry properties simplified:',symbols.get('propertiesSimplified',0))
          print('Asset-size libraries:',len(spec.get('assetSizes',{})))
          print('Missing public UI libraries:', missing)
          print('Extracted PNG files:', len(list((root/'assets').rglob('*.png'))))
          if exact != spec['windowCount'] or missing or discovered-covered:
              raise SystemExit('Zircon UI reference coverage check failed')
          PY

      - name: Upload complete Zircon GameScene UI reference
        uses: actions/upload-artifact@v4
        with:
          name: zircon-ui-reference-complete
          path: .build/zircon-ui
          if-no-files-found: error
          retention-days: 14
