name: Build complete Zircon UI reference

on:
  workflow_dispatch:
  push:
    branches: [origins-game-v1]
    paths:
      - ".github/workflows/build-zircon-ui-reference.yml"
      - "tools/zircon-ui-importer/**"
      - "apps/zircon-ui-reference/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout ORIGINS
        uses: actions/checkout@v4

      - name: Install Pillow
        run: python3 -m pip install --user Pillow

      - name: Checkout matching Zircon source specification
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .source/Zircon
          git clone --depth 1 https://github.com/Suprcode/Zircon.git .source/Zircon
          git -C .source/Zircon rev-parse HEAD

      - name: Build complete GameScene UI source manifest
        run: |
          rm -rf .build/zircon-ui
          mkdir -p .build/zircon-ui .source/zircon-ui-libraries
          python3 tools/zircon-ui-importer/build_ui_source_spec.py \
            --zircon-root .source/Zircon \
            --out .build/zircon-ui/ui-source-spec.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('.build/zircon-ui/ui-source-spec.json')
          d=json.loads(p.read_text())
          print('GameScene entries:', d['windowCount'])
          missing=[w for w in d['windows'] if w.get('sourceMissing')]
          print('Missing source classes:', [w['class'] for w in missing])
          if d['windowCount'] < 60:
              raise SystemExit('GameScene UI inventory unexpectedly incomplete')
          character=next(w for w in d['windows'] if w['field']=='CharacterBox')
          expression=character.get('root',{}).get('Index','')
          print('Character root index expression:', expression)
          if '115' not in expression or '110' not in expression:
              raise SystemExit('Root parser lost CharacterDialog conditional index')
          if 161 not in d['assetRefs'].get('GameInter',[]) or 162 not in d['assetRefs'].get('GameInter',[]):
              raise SystemExit('DXCheckBox GameInter skin indices are missing')
          PY

      - name: Download and extract exact referenced Zircon UI artwork
        run: |
          python3 tools/zircon-ui-importer/build_full_reference_assets.py \
            --spec .build/zircon-ui/ui-source-spec.json \
            --source-dir .source/zircon-ui-libraries \
            --out .build/zircon-ui

      - name: Assemble complete navigable reference
        run: |
          cp apps/zircon-ui-reference/index.html .build/zircon-ui/index.html
          cp apps/zircon-ui-reference/styles.css .build/zircon-ui/styles.css
          cp apps/zircon-ui-reference/app.js .build/zircon-ui/app.js
          cp apps/zircon-ui-reference/game-scene-windows.js .build/zircon-ui/game-scene-windows.js
          node --check .build/zircon-ui/app.js
          node --check .build/zircon-ui/game-scene-windows.js
          test -s .build/zircon-ui/ui-source-spec.json
          test -s .build/zircon-ui/assets/GameInter/00050.png
          test -s .build/zircon-ui/assets/GameInter/00161.png
          test -s .build/zircon-ui/assets/GameInter/00162.png
          test -s .build/zircon-ui/assets/Interface/00016.png
          test -s .build/zircon-ui/assets/Interface/00041.png
          test -s .build/zircon-ui/assets/Interface/00044.png
          test -s .build/zircon-ui/assets/Interface/00053.png
          test -s .build/zircon-ui/assets/Interface/00056.png
          test -s .build/zircon-ui/assets/Interface/00110.png
          test -s .build/zircon-ui/assets/Interface/00130.png
          test -s .build/zircon-ui/assets/Interface/00241.png
          test -s .build/zircon-ui/assets/Interface/00291.png

      - name: Report reconstruction coverage
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('.build/zircon-ui')
          spec=json.loads((root/'ui-source-spec.json').read_text())
          assets=json.loads((root/'asset-build.json').read_text())
          exact=sum(1 for w in spec['windows'] if w.get('sourcePath'))
          missing=[k for k,v in assets.items() if v.get('missing')]
          print(f"Source-resolved windows: {exact}/{spec['windowCount']}")
          print('Missing public UI libraries:', missing)
          print('Extracted PNG files:', len(list((root/'assets').rglob('*.png'))))
          PY

      - name: Upload complete Zircon GameScene UI reference
        uses: actions/upload-artifact@v4
        with:
          name: zircon-ui-reference-complete
          path: .build/zircon-ui
          if-no-files-found: error
          retention-days: 14
