name: HPR Zircon Builder Selftest

on:
  push:
    branches:
      - tools/hpr-zircon-builder-v1
    paths:
      - 'TOOLS/hpr_zircon_builder/**'
      - '.github/workflows/hpr_zircon_builder_selftest.yml'
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requirements
        run: python -m pip install -r TOOLS/hpr_zircon_builder/requirements.txt
      - name: Run roundtrip selftest
        working-directory: TOOLS/hpr_zircon_builder
        run: python selftest.py
