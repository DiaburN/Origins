name: Build Crystal UI reference

on:
  push:
    branches: [crystal-ui-v1]
    paths:
      - ".github/workflows/build-crystal-ui-reference.yml"
      - "tools/crystal-ui-importer/**"
      - "apps/crystal-ui-reference/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout ORIGINS
        uses: actions/checkout@v4

      - name: Prepare folders
        run: |
          mkdir -p .source/ui .source/downloads .source/WemadeMir2 .source/maps
          rm -rf .build/crystal-ui
          mkdir -p .build/crystal-ui/reference

      - name: Download public Crystal UI libraries
        run: |
          BASE="https://files.lomcn.co.uk/resources/mir2/crystal/patch_oldversion/Data"
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36"
          for LIB in Prguse Prguse2 Title; do
            echo "Downloading ${LIB}.Lib.gz"
            curl -fL --retry 5 --retry-delay 3 -A "$UA" "$BASE/${LIB}.Lib.gz" -o ".source/downloads/${LIB}.Lib.gz"
            gzip -dc ".source/downloads/${LIB}.Lib.gz" > ".source/ui/${LIB}.Lib"
          done
          ls -lh .source/ui

      - name: Extract exact Crystal UI images
        run: |
          python3 tools/crystal-ui-importer/extract_ui_assets.py --data .source/ui --out .build/crystal-ui

      - name: Download Zuma reference map sources
        run: |
          curl -fL --retry 4 --retry-delay 3 https://raw.githubusercontent.com/Suprcode/Crystal.Database/main/Jev/Maps/d515.map -o .source/maps/d515.map
          BASE="https://files.lomcn.co.uk/resources/mir2/crystal/patch_oldversion/Data/Map/WeMade-Mir2"
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36"
          for LIB in SmTiles Objects2 Objects6 Tiles; do
            curl -fL --retry 5 --retry-delay 3 -A "$UA" "$BASE/${LIB}.Lib.gz" -o ".source/downloads/${LIB}.Lib.gz"
            gzip -dc ".source/downloads/${LIB}.Lib.gz" > ".source/WemadeMir2/${LIB}.Lib"
          done

      - name: Render real d515 Zuma background
        run: |
          python3 tools/crystal-map-importer/render_mir2_2010_reference.py \
            --data .source/WemadeMir2 \
            --map .source/maps/d515.map \
            --out .build/crystal-ui/reference/d515-full.png

      - name: Assemble interactive Crystal UI reference
        run: |
          cp apps/crystal-ui-reference/index.html .build/crystal-ui/index.html
          cp apps/crystal-ui-reference/styles.css .build/crystal-ui/styles.css
          cp apps/crystal-ui-reference/app.js .build/crystal-ui/app.js
          test -s .build/crystal-ui/ui-assets.json
          test -s .build/crystal-ui/reference/d515-full.png
          du -sh .build/crystal-ui

      - name: Upload Crystal UI reference
        uses: actions/upload-artifact@v4
        with:
          name: crystal-ui-reference
          path: .build/crystal-ui
          if-no-files-found: error
          retention-days: 14
