name: Origins DxR - Bichon Chat Preview

on:
  push:
    branches: [Origins-DxR]
    paths:
      - '.github/workflows/origins-dxr-bichon-chat-preview.yml'
      - 'docs/generated/bichon-map0/real-overview.png'
      - 'docs/generated/bichon-map0/real-detail.png'

permissions:
  contents: write

concurrency:
  group: origins-dxr-bichon-chat-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build small previews from real render
        run: |
          python -m pip install pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import base64, hashlib
          root=Path('docs/generated/bichon-map0')
          specs=[('real-overview.png','chat-overview.jpg.b64',1100),('real-detail.png','chat-detail.jpg.b64',1400)]
          for src_name,out_name,maxw in specs:
              src=root/src_name
              im=Image.open(src).convert('RGB')
              if im.width>maxw:
                  h=round(im.height*maxw/im.width)
                  im=im.resize((maxw,h),Image.Resampling.LANCZOS)
              tmp=root/out_name.replace('.b64','')
              im.save(tmp,'JPEG',quality=68,optimize=True,progressive=True)
              raw=tmp.read_bytes()
              (root/out_name).write_text(base64.b64encode(raw).decode('ascii'),encoding='ascii')
              print(src_name, im.size, len(raw), hashlib.sha256(raw).hexdigest())
              tmp.unlink()
          PY
      - name: Commit previews
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/generated/bichon-map0/chat-overview.jpg.b64 docs/generated/bichon-map0/chat-detail.jpg.b64
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs(map): add chat-friendly real Bichon previews'
          git pull --rebase origin Origins-DxR
          git push origin HEAD:Origins-DxR
