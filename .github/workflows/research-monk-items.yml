name: Research Crystal-Monk item database

on:
  push:
    branches:
      - research/monk-items-source
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Jev public Crystal database
        run: |
          set -euo pipefail
          mkdir -p research_out/jev
          curl -fL --retry 3 \
            https://raw.githubusercontent.com/Suprcode/Crystal.Database/main/Jev/Server.MirDB \
            -o research_out/jev/Server.MirDB
          file research_out/jev/Server.MirDB | tee research_out/jev/file.txt
          sha256sum research_out/jev/Server.MirDB | tee research_out/jev/sha256.txt
          strings -a -n 3 research_out/jev/Server.MirDB > research_out/jev/strings.txt
          grep -in -C 25 'monk' research_out/jev/strings.txt > research_out/jev/monk_context.txt || true

      - name: Inspect Crystal-Monk Server release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p research_out/release/assets research_out/release/extracted
          python3 - <<'PY'
          import json, os, urllib.request
          api='https://api.github.com/repos/JevLOMCN/Crystal-Monk/releases/tags/Server'
          req=urllib.request.Request(api, headers={
              'Accept':'application/vnd.github+json',
              'User-Agent':'ORIGINS-research',
          })
          with urllib.request.urlopen(req) as r:
              release=json.load(r)
          with open('research_out/release/release.json','w',encoding='utf-8') as f:
              json.dump(release,f,indent=2)
          rows=[]
          for a in release.get('assets',[]):
              rows.append(f"{a.get('id')}\t{a.get('name')}\t{a.get('size')}\t{a.get('browser_download_url')}")
              url=a['browser_download_url']
              name=a['name']
              out=os.path.join('research_out/release/assets',name)
              rq=urllib.request.Request(url, headers={'User-Agent':'ORIGINS-research'})
              with urllib.request.urlopen(rq) as src, open(out,'wb') as dst:
                  dst.write(src.read())
          with open('research_out/release/assets.tsv','w',encoding='utf-8') as f:
              f.write('\n'.join(rows)+'\n')
          PY
          cat research_out/release/assets.tsv
          find research_out/release/assets -maxdepth 1 -type f -printf '%f\t%s bytes\n' | sort > research_out/release/asset_files.txt
          while IFS= read -r -d '' f; do
            bn="$(basename "$f")"
            d="research_out/release/extracted/${bn//[^A-Za-z0-9._-]/_}"
            mkdir -p "$d"
            case "$f" in
              *.zip|*.ZIP) unzip -q -o "$f" -d "$d" || true ;;
              *.rar|*.RAR) 7z x -y "$f" -o"$d" >/dev/null || true ;;
              *.7z) 7z x -y "$f" -o"$d" >/dev/null || true ;;
              *.tar.gz|*.tgz) tar -xzf "$f" -C "$d" || true ;;
            esac
          done < <(find research_out/release/assets -maxdepth 1 -type f -print0)
          find research_out/release/extracted -type f -printf '%p\t%s bytes\n' | sort > research_out/release/extracted_inventory.txt
          find research_out/release/extracted -type f \( -iname '*.MirDB' -o -iname 'Server.MirDB' \) -print > research_out/release/mirdb_files.txt || true
          : > research_out/release/monk_context.txt
          while IFS= read -r db; do
            [ -f "$db" ] || continue
            echo "===== $db =====" >> research_out/release/monk_context.txt
            strings -a -n 3 "$db" | grep -in -C 40 'monk' >> research_out/release/monk_context.txt || true
            sha256sum "$db" >> research_out/release/mirdb_sha256.txt
          done < research_out/release/mirdb_files.txt

      - name: Show Monk string contexts
        run: |
          echo '===== JE V DB ====='
          cat research_out/jev/monk_context.txt || true
          echo '===== CRYSTAL-MONK RELEASE ====='
          cat research_out/release/monk_context.txt || true

      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: crystal-monk-item-research
          path: research_out/
          if-no-files-found: error
