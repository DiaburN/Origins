name: ORIGINS System DB

on:
  push:
    branches: [main]
    paths:
      - 'src/Origins.Database/**'
      - 'tools/Origins.Database.*/**'
      - 'tools/Origins.UsersDb.Smoke/**'
      - 'tools/Origins.CrystalJevMagic.Export/**'
      - 'database/overlays/**'
      - 'database/magic/**'
      - 'database/index-policy.json'
      - 'overrides/zircon/**'
      - 'patches/zircon/**'
      - 'scripts/**'
      - '.github/workflows/origins-system-db.yml'
  pull_request:
    paths:
      - 'src/Origins.Database/**'
      - 'tools/Origins.Database.*/**'
      - 'tools/Origins.UsersDb.Smoke/**'
      - 'tools/Origins.CrystalJevMagic.Export/**'
      - 'database/overlays/**'
      - 'database/magic/**'
      - 'database/index-policy.json'
      - 'overrides/zircon/**'
      - 'patches/zircon/**'
      - 'scripts/**'
      - '.github/workflows/origins-system-db.yml'
  workflow_dispatch:

concurrency:
  group: origins-system-db-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-origins-system-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ORIGINS
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install .NET 8 for Crystal reader
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install 7-Zip
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Pin upstream sources
        run: |
          bash scripts/bootstrap-zircon.sh
          bash scripts/bootstrap-crystal.sh
          bash scripts/bootstrap-crystal-monk.sh
          bash scripts/bootstrap-crystal-database.sh

      - name: Validate 119 active spells and deferred Monk source
        run: python3 scripts/validate-crystal-playable-spells.py

      - name: Verify runtime-ready MagicObject registrations
        run: python3 scripts/verify-magic-handler-registration.py ./vendor/zircon ./database/magic/behavior-decisions.json

      - name: Compile overridden Zircon runtime
        run: dotnet build vendor/zircon/ServerLibrary/ServerLibrary.csproj --configuration Release

      - name: Fetch and migrate Zircon content base
        run: |
          bash scripts/fetch-zircon-system-db.sh
          dotnet run --project tools/Origins.Database.Upgrade/Origins.Database.Upgrade.csproj --configuration Release -- ./Database/System.db ./DatabaseBase ./BackupBase
          dotnet run --project tools/Origins.Database.Verify/Origins.Database.Verify.csproj --configuration Release -- ./DatabaseBase ./BackupBase

      - name: Export index-preserving base snapshot
        run: dotnet run --project tools/Origins.Database.Export/Origins.Database.Export.csproj --configuration Release -- ./DatabaseBase ./SnapshotBase ./BackupBase

      - name: Generate active Crystal and Crystal-Monk spell values
        run: |
          set -euo pipefail
          mkdir -p GeneratedResearch

          python3 scripts/generate-crystal-magic-catalog-safe.py ./vendor/crystal ./GeneratedResearch/crystal-source-catalog.json
          dotnet run --project tools/Origins.CrystalJevMagic.Export/Origins.CrystalJevMagic.Export.csproj --configuration Release -- ./vendor/crystal-database/Jev/Server.MirDB ./GeneratedResearch/crystal-jev-effective-magics.json
          python3 scripts/project-crystal-magic-numerics.py ./GeneratedResearch/crystal-source-catalog.json ./GeneratedResearch/crystal-jev-effective-magics.json ./GeneratedResearch/crystal-zircon-numeric-projection.json

          python3 scripts/generate-crystal-monk-magic-catalog.py ./vendor/crystal-monk ./GeneratedResearch/crystal-monk-source-catalog.json
          python3 scripts/project-crystal-source-magic-numerics.py ./GeneratedResearch/crystal-monk-source-catalog.json ./GeneratedResearch/crystal-monk-zircon-numeric-projection.json

          python3 scripts/generate-ready-crystal-magic-overlay.py ./GeneratedResearch/crystal-zircon-numeric-projection.json ./database/magic/behavior-decisions.json ./SnapshotBase/LibraryCore__Library_SystemModels_MagicInfo.json ./GeneratedResearch/70-magics-crystal-runtime-ready.generated.json

          python3 scripts/generate-crystal-playable-magic-overlay.py \
            ./GeneratedResearch/crystal-zircon-numeric-projection.json \
            ./GeneratedResearch/crystal-monk-zircon-numeric-projection.json \
            ./database/magic/crystal-playable-spells.json \
            ./GeneratedResearch/70-magics-crystal-runtime-ready.generated.json \
            ./SnapshotBase/LibraryCore__Library_SystemModels_MagicInfo.json \
            ./GeneratedResearch/70-magics-crystal.generated.json

          python3 - <<'PY'
          import json
          p=json.load(open('GeneratedResearch/70-magics-crystal.generated.json', encoding='utf-8'))
          assert len(p['Operations']) == 119, len(p['Operations'])
          assert p['$audit']['classCounts'] == {'Warrior':21,'Wizard':28,'Taoist':27,'Assassin':19,'Archer':24}
          assert p['$audit']['deferredMonkSpellsExcluded'] == 9
          print('Full active magic overlay validated: 119/119; Monk deferred: 9')
          PY

      - name: Assemble ORIGINS overlay set
        run: |
          mkdir -p GeneratedOverlays
          cp database/overlays/*.json GeneratedOverlays/
          cp GeneratedResearch/70-magics-crystal.generated.json GeneratedOverlays/70-magics-crystal.json

      - name: Apply ORIGINS overlays and rebuild System.db
        run: |
          dotnet run --project tools/Origins.Database.ApplyOverlay/Origins.Database.ApplyOverlay.csproj --configuration Release -- ./SnapshotBase ./GeneratedOverlays ./SnapshotOrigins ./database/index-policy.json
          dotnet run --project tools/Origins.Database.Import/Origins.Database.Import.csproj --configuration Release -- ./SnapshotOrigins ./DatabaseOrigins ./BackupOrigins
          dotnet run --project tools/Origins.Database.Verify/Origins.Database.Verify.csproj --configuration Release -- ./DatabaseOrigins ./BackupOrigins
          dotnet run --project tools/Origins.Database.Audit/Origins.Database.Audit.csproj --configuration Release -- ./DatabaseOrigins ./DatabaseOrigins/audit.json ./BackupOrigins

      - name: Prove Users.db can learn a spell from final System.db
        run: dotnet run --project tools/Origins.UsersDb.Smoke/Origins.UsersDb.Smoke.csproj --configuration Release -- ./DatabaseOrigins/System.db ./DatabaseOrigins/usersdb-smoke.json

      - name: Build manifest
        shell: bash
        run: |
          SYSTEM_SHA=$(sha256sum DatabaseOrigins/System.db | awk '{print $1}')
          RUNTIME_READY=$(python3 -c "import json; print(json.load(open('GeneratedResearch/70-magics-crystal.generated.json'))['\$audit']['runtimeReady'])")
          cat > DatabaseOrigins/build-manifest.json <<EOF
          {
            "schemaVersion": 5,
            "zirconCommit": "cbf1aa919083bc13fc3f23f93772a8ab8370632d",
            "crystalCommit": "0e315fe327192afe52c3d7357ddd1f5b7e26c5b8",
            "crystalMonkCommit": "381e589e3d7ee736cdf0583c8315c0d144ab058f",
            "crystalDatabaseJevCommit": "a19f6dca8f5e238d4ed79801820777abbf0a9ca4",
            "systemDbSha256": "$SYSTEM_SHA",
            "activePlayableClassCount": 5,
            "activePlayableSpellCount": 119,
            "warriorSpells": 21,
            "wizardSpells": 28,
            "taoistSpells": 27,
            "assassinSpells": 19,
            "archerSpells": 24,
            "deferredMonkSpells": 9,
            "sourceCatalogTotalWithDeferredMonk": 128,
            "crystalMonkExtraNonMonkSpells": 14,
            "runtimeReadySpellCount": $RUNTIME_READY,
            "pendingSpellsUseReservedMagicType": true,
            "crystalJoinKey": "normalized spell name",
            "numericSpellIdUsedAsJevJoinKey": false,
            "magicDecisionManifest": "database/magic/behavior-decisions.json",
            "runtime": "Zircon MagicObject with explicit ORIGINS Crystal overrides/patches"
          }
          EOF

      - name: Upload ORIGINS System.db artifact
        uses: actions/upload-artifact@v4
        with:
          name: origins-system-db
          path: |
            DatabaseOrigins/System.db
            DatabaseOrigins/build-manifest.json
            DatabaseOrigins/audit.json
            DatabaseOrigins/usersdb-smoke.json
            GeneratedResearch/70-magics-crystal.generated.json
            GeneratedResearch/70-magics-crystal-runtime-ready.generated.json
            GeneratedResearch/crystal-zircon-numeric-projection.json
            GeneratedResearch/crystal-monk-source-catalog.json
            GeneratedResearch/crystal-monk-zircon-numeric-projection.json
            SnapshotOrigins/overlay-report.json
          if-no-files-found: error

      - name: Publish generated ORIGINS database branch
        if: success() && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf database/generated/origins-system-db
          mkdir -p database/generated/origins-system-db
          cp DatabaseOrigins/System.db database/generated/origins-system-db/System.db
          cp DatabaseOrigins/build-manifest.json database/generated/origins-system-db/build-manifest.json
          cp DatabaseOrigins/audit.json database/generated/origins-system-db/audit.json
          cp DatabaseOrigins/usersdb-smoke.json database/generated/origins-system-db/usersdb-smoke.json
          cp GeneratedResearch/70-magics-crystal.generated.json database/generated/origins-system-db/70-magics-crystal.generated.json
          cp GeneratedResearch/70-magics-crystal-runtime-ready.generated.json database/generated/origins-system-db/70-magics-crystal-runtime-ready.generated.json
          cp GeneratedResearch/crystal-zircon-numeric-projection.json database/generated/origins-system-db/crystal-zircon-numeric-projection.json
          cp GeneratedResearch/crystal-monk-source-catalog.json database/generated/origins-system-db/crystal-monk-source-catalog.json
          cp GeneratedResearch/crystal-monk-zircon-numeric-projection.json database/generated/origins-system-db/crystal-monk-zircon-numeric-projection.json
          cp SnapshotOrigins/overlay-report.json database/generated/origins-system-db/overlay-report.json

          git config user.name "ORIGINS Database Bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B generated/origins-system-db
          git add -f database/generated/origins-system-db
          git commit -m "generated(db): rebuild ORIGINS System.db with 119 active Crystal spells" || exit 0
          git push --force origin HEAD:generated/origins-system-db
