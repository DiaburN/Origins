<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ORIGINS X</title>
  <link rel="stylesheet" href="css/game.css">
  <link rel="stylesheet" href="css/ingame.css">
  <link rel="stylesheet" href="css/magic.css">
  <link rel="stylesheet" href="css/zircon-ui.css">
  <link rel="stylesheet" href="css/zircon-layout.css">
  <link rel="stylesheet" href="css/zircon-primitives.css">
  <link rel="stylesheet" href="css/character-ui.css">
</head>
<body>
  <main id="flow-shell" class="flow-shell">
    <section id="login-screen" class="origin-screen is-active" aria-label="Inicio de sesión">
      <div class="zircon-scene" data-zircon-scene>
        <img class="scene-bg" src="assets/ui/login/login-bg.webp" alt="">
        <div class="zircon-standard-layer"></div>
        <div class="zircon-logo" aria-label="Legend of Mir III - ORIGINS X">
          <img class="logo-light" src="assets/ui/zircon/logo.webp" alt="Legend of Mir III">
          <span class="origins-mark">ORIGINS X</span>
        </div>
        <form id="login-form" class="zircon-login-strip" autocomplete="off">
          <button class="login-icon-button ranking-button" type="button" data-local-info="Ranking disponible cuando conectemos la base de datos.">Ranking</button>
          <button class="login-icon-button option-button" type="button" data-local-info="Las opciones se conectarán al menú completo de juego.">Opciones</button>
          <button class="login-icon-button account-button" type="button" data-local-info="De momento usamos una cuenta local de prueba.">Crear cuenta</button>
          <div class="login-title">INICIAR SESIÓN</div>
          <label class="zircon-field email-field"><span>Cuenta</span><input id="login-user" autocomplete="username" value="Origins"></label>
          <label class="zircon-field password-field"><span>Contraseña</span><input id="login-password" type="password" autocomplete="current-password" value="origins"></label>
          <button class="zircon-button login-submit" type="submit">ENTRAR</button>
          <button id="login-exit" class="zircon-button login-exit" type="button">SALIR</button>
          <p id="login-message" class="zircon-message"></p>
        </form>
      </div>
    </section>

    <section id="select-screen" class="origin-screen" aria-label="Selección de personaje">
      <div class="zircon-scene" data-zircon-scene>
        <img class="scene-bg" src="assets/ui/zircon/select-bg.webp" alt="">
        <div class="zircon-standard-layer"></div>
        <button class="zircon-config-button" type="button" data-local-info="Configuración: la conectaremos al menú de opciones."><img src="assets/ui/zircon/config.webp" alt="Configuración"></button>
        <section class="zircon-window select-window">
          <button id="select-logout" class="zircon-close" type="button" title="Cambiar cuenta"><span aria-hidden="true">×</span></button>
          <h1 class="window-title">SELECCIÓN DE PERSONAJE</h1>
          <div id="character-list" class="zircon-character-list"></div>
          <div class="select-actions">
            <button id="play-character" class="zircon-button" type="button" disabled>ENTRAR</button>
            <button id="create-open" class="zircon-button" type="button">CREAR</button>
            <button id="delete-character" class="zircon-button" type="button" disabled>ELIMINAR</button>
          </div>
        </section>
        <section class="select-character-stage" aria-live="polite">
          <img id="selected-preview" class="select-character-preview is-hidden" alt="">
          <div class="select-character-copy"><strong id="selected-name">Selecciona un personaje</strong><span id="selected-meta"></span></div>
        </section>
      </div>
    </section>

    <section id="create-screen" class="origin-screen" aria-label="Crear personaje">
      <div class="zircon-scene" data-zircon-scene>
        <img class="scene-bg" src="assets/ui/zircon/select-bg.webp" alt="">
        <div class="zircon-standard-layer create-ambient"></div>
        <form id="create-form" class="zircon-window create-window">
          <button id="create-back" class="zircon-close" type="button" title="Volver"><span aria-hidden="true">×</span></button>
          <h1 class="window-title">CREAR PERSONAJE</h1>
          <div class="creator-class-row" aria-label="Clase">
            <button type="button" data-class="Warrior">Warrior</button><button type="button" data-class="Wizard">Wizard</button><button type="button" data-class="Taoist">Taoist</button><button type="button" data-class="Assassin">Assassin</button>
          </div>
          <div id="creator-class-name" class="creator-selected-label">Warrior</div>
          <div class="creator-gender-row" aria-label="Sexo"><button type="button" data-gender="male">Hombre</button><button type="button" data-gender="female">Mujer</button></div>
          <div class="creator-character-display"><img id="creator-preview" src="assets/ui/zircon/characters/warrior-male.webp" alt="Vista previa"></div>
          <label class="creator-name-field">Nombre<input id="character-name" maxlength="16" autocomplete="off" placeholder="Nombre"></label>
          <p id="create-message" class="zircon-message creator-message"></p>
          <button class="zircon-button creator-submit" type="submit">CREAR</button>
        </form>
      </div>
    </section>
  </main>

  <canvas id="game" hidden aria-label="ORIGINS X game canvas"></canvas>

  <div id="ingame-ui" hidden>
    <section id="minimap-box" class="ingame-minimap" aria-label="Minimapa">
      <div id="minimap-area" class="minimap-area">
        <img id="minimap-image" class="minimap-image" alt="" hidden>
        <div id="minimap-player" class="minimap-player" title="Tu personaje" hidden></div>
      </div>
      <img id="minimap-frame" class="minimap-frame" src="assets/ui/zircon/minimap-frame-200.webp" alt="">
      <header class="minimap-header"><span id="minimap-title">Sabuk-Prov</span></header>
      <div class="minimap-tools">
        <button id="minimap-size" type="button" title="Cambiar tamaño"><img src="assets/ui/zircon/minimap-size.webp" alt=""></button>
        <button id="minimap-opacity" type="button" title="Transparencia"><img src="assets/ui/zircon/minimap-opacity.webp" alt=""></button>
        <button id="minimap-bigmap" type="button" title="Mapa grande"><img src="assets/ui/zircon/minimap-bigmap.webp" alt=""></button>
      </div>
    </section>

    <div id="ui-window-layer" class="ui-window-layer"></div>

    <div id="game-hud" class="zircon-game-hud" aria-label="Panel principal">
      <img class="main-panel-image" src="assets/ui/zircon/main-panel.webp" alt="">

      <i id="hud-exp-frame" class="hud-sprite hud-exp-frame"></i>
      <i id="hud-exp-fill" class="hud-sprite hud-exp-fill"></i>
      <i id="hud-hp-fill" class="hud-sprite hud-hp-fill"></i>
      <i id="hud-mp-fill" class="hud-sprite hud-mp-fill"></i>
      <i id="hud-focus-fill" class="hud-sprite hud-focus-fill"></i>

      <span id="hud-hp-text" class="hud-value hud-value-hp">100/100</span>
      <span id="hud-mp-text" class="hud-value hud-value-mp">75/75</span>
      <span id="hud-focus-text" class="hud-value hud-value-focus"></span>

      <i id="hud-icon-class" class="hud-sprite hud-icon hud-icon-class"></i>
      <i id="hud-icon-level" class="hud-sprite hud-icon hud-icon-level"></i>
      <i id="hud-icon-fp" class="hud-sprite hud-icon hud-icon-fp"></i>
      <i id="hud-icon-cp" class="hud-sprite hud-icon hud-icon-cp"></i>
      <i id="hud-icon-ac" class="hud-sprite hud-icon hud-icon-ac"></i>
      <i id="hud-icon-dc" class="hud-sprite hud-icon hud-icon-dc"></i>
      <i id="hud-icon-mac" class="hud-sprite hud-icon hud-icon-mac"></i>
      <i id="hud-icon-mc" class="hud-sprite hud-icon hud-icon-mc"></i>
      <i id="hud-icon-sc" class="hud-sprite hud-icon hud-icon-sc"></i>

      <span id="panel-class" class="hud-label hud-label-class"></span>
      <span id="panel-level" class="hud-label hud-label-level"></span>
      <span id="panel-fp" class="hud-label hud-label-fp"></span>
      <span id="panel-cp" class="hud-label hud-label-cp"></span>
      <span id="panel-ac" class="hud-label hud-label-ac"></span>
      <span id="panel-dc" class="hud-label hud-label-dc"></span>
      <span id="panel-mac" class="hud-label hud-label-mac"></span>
      <span id="panel-mc" class="hud-label hud-label-mc"></span>
      <span id="panel-sc" class="hud-label hud-label-sc"></span>

      <span id="game-character-name" hidden></span><span id="game-character-class" hidden></span>
    </div>
  </div>

  <div id="local-toast" class="local-toast" hidden></div>

  <script src="js/core/config.js"></script>
  <script src="js/core/math.js"></script>
  <script src="js/core/mir-animation.js"></script>
  <script src="js/core/mir-sprites.js"></script>
  <script src="js/core/mir-map.js"></script>
  <script src="js/core/mir-map-renderer.js"></script>
  <script src="js/core/input.js"></script>
  <script src="js/core/camera.js"></script>
  <script src="js/systems/session.js"></script>
  <script src="js/systems/player-state.js"></script>
  <script src="js/systems/map-world.js"></script>
  <script src="js/systems/movement.js"></script>
  <script src="js/entities/player.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ui/game-ui-assets.js"></script>
  <script src="js/ui/mainpanel-assets.js"></script>
  <script src="js/ui/zircon-primitives-assets.js"></script>
  <script src="js/ui/zircon-primitives.js"></script>
  <script src="js/ui/character-paperdoll-assets.js"></script>
  <script src="js/ui/character-appearance.js"></script>
  <script src="js/ui/ingame.js"></script>
  <script src="js/ui/zircon-layout.js"></script>
  <script src="js/ui/character-ui.js"></script>
  <script src="js/ui/magic-ui.js"></script>
  <script src="js/ui/flow.js"></script>
</body>
</html>
